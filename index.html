     b:"Base holds the smallest legal physical address and limit holds the size of the range. Lecture example: base 300040 plus limit 120900 = 420940, so legal addresses run from 300040 up to, but not including, 420940. The hardware checks every user-mode address in two steps: is it at least the base, and is it below base + limit? Failing either check traps to the OS with an illegal addressing error.",
     q:["Base = 300040 and limit = 120900. Is address 420950 legal?","No, it's past 300040 + 120900 = 420940, so it traps","Yes, because it's above the base","Yes, the limit is ignored in user mode","Only if the process is in the ready state","Legal addresses stop just below base + limit."]},
    {id:"binding", t:"Address binding", d:"Turning the names in source code into relocatable addresses, and then into absolute addresses in real memory.",
     b:"Programs on disk waiting to be brought into memory form an input queue. Without OS support, a program would have to load at address 0000, which is inconvenient because the OS and other programs need that space too. So addresses change form along the way: source code uses symbolic addresses (int count); the compiler binds them to relocatable addresses (14 bytes from the beginning of this module); the linker or loader binds those to absolute addresses. Lecture example: P1 is loaded at 30000, so count, 14 bytes in, lands at absolute address 30014.",
     q:["Process P1 is loaded at base address 30000, and count sits 14 bytes into the module. What is its absolute address?","30014","14","30000","44000","Absolute address = base address + relocatable address = 30000 + 14."]},
    {id:"bindtimes", t:"When binding happens", d:"Binding can happen at compile time, load time or execution time; the later it happens, the more freely the process can move.",
     b:"Compile time: if the memory location is known in advance, absolute code is generated, and the code must be recompiled if the start location changes. Load time: relocatable code is generated when the location isn't known at compile time. Execution time: binding waits until run time, so a process can move between memory segments while it runs, which needs hardware support such as base and limit registers. Logical and physical addresses are the same under compile-time and load-time binding, and differ under execution-time binding.",
     q:["A process must be moved to another memory area while it is running. When must binding happen?","At execution time","At compile time","At load time","Never, it can't move","Only execution-time binding lets a running process move."]},
    {id:"mmu", t:"Logical addresses and the MMU", d:"The CPU generates logical, or virtual, addresses; memory sees physical ones; a hardware unit maps between them at run time.",
     b:"The memory management unit (MMU) maps virtual to physical addresses at run time. Its simplest form is a relocation register, a generalized base register, whose value is added to every address a user process sends to memory. Example: logical 346 + relocation 14000 = physical 14346. The user program never sees real physical addresses. The logical address space is every logical address a program generates; the physical address space is the matching set of addresses in RAM.",
     q:["The relocation register holds 14000 and the CPU generates logical address 346. Which physical address is used?","14346","14000","346","13654","Physical = logical + relocation = 346 + 14000."]},
    {id:"dynamic", t:"Dynamic loading", d:"Loading a routine only when it is first called, instead of bringing the whole program into memory.",
     b:"The entire program doesn't need to be in memory to execute. A routine is not loaded until it is called. All routines are kept on disk in relocatable load format. This is useful when large amounts of code are needed to handle cases that rarely happen, like error handling.",
     q:["A program has a huge error-recovery routine that almost never runs. What keeps it from wasting memory?","Dynamic loading: it stays on disk until it's called","Compile-time binding","Contiguous allocation","A bigger limit register","Routines are loaded only when they are called."]},
    {id:"dynlink", t:"Dynamic linking and shared libraries", d:"Postponing the linking of system libraries until execution time, so programs can share one copy of a library.",
     b:"Static linking: the loader combines system libraries and program code into one binary program image. Dynamic linking: linking is postponed until execution time. A stub is a small piece of code that locates the right library routine resident in memory. The OS checks whether the routine is in memory, and loads the library if it isn't.",
     q:["What does the stub do in dynamic linking?","Locates the library routine, loading it if it isn't in memory yet","Allocates the heap","Sets the base register","Compiles the library","The stub is a small piece of code that finds the real routine."]}
  ],
  bossQ:[
    ["baselimit","The CPU compares the Stray Pointer's address with the base and finds it smaller. What happens?","It traps to the OS with an illegal addressing error","It checks the limit next and continues","It adds the relocation register","It loads the page from disk","Failing the first check, address >= base, traps straight away."],
    ["bindtimes","The program's starting location is known before it is compiled. Which binding time can generate absolute code?","Compile time","Load time","Execution time","None of them","A location known in advance lets the compiler produce absolute code."],
    ["binding","Your compiler turns int count into \"14 bytes from the beginning of this module\". What kind of address is that?","Relocatable","Symbolic","Absolute","Physical","Compilers bind symbolic names to relocatable addresses."],
    ["mmu","The relocation register is 14000 and the program uses logical address 0. Which physical address is that?","14000","0","14346","Any free frame","0 + 14000 = 14000."],
    ["dynlink","Under dynamic linking, the stub finds the library routine isn't in memory. What does the OS do?","Loads the library, then the routine runs","Aborts the process","Recompiles the program","Links it statically into the binary","The OS checks for the routine and loads the library if needed."],
    ["recall","Which memory sits between the CPU and main memory, and is faster than main memory?","The cache","The backing store","The page table","The swap space","The cache softens the wait for slow memory reads."]
  ]
},
{
  id:9, sec:8, district:"Partition Yard", lec:"Lecture 7, Section 8", topic:"Contiguous allocation, swapping, fit strategies, fragmentation and segmentation", color:"#f5a3ff",
  pal:{a:"#26102a", b:"#2e1433", w:"#5c2a66", t:"#8a3f99"},
  boss:{ name:"The Fragmenter", role:"shredder of free memory", color:"#ffd166", look:{heads:2},
    intro:"Plenty of free memory. Just none of it together. Isn't it beautiful?",
    hurt:["You compacted me! I'm all in one piece!","That hole fits perfectly. I hate it.","Stop placing requests correctly!"],
    miss:["Wrong hole. Now it's split in two.","Another sliver of wasted space, just for you.","Out of range. That's a trap."] },
  intro:["Partition Yard. Here every process gets one unbroken stretch of memory, and whatever is left over becomes a hole.",
         "The Fragmenter has been chopping free memory into holes too small to use. Requests are piling up with nowhere to go."],
  mid:"Look at the holes. 10 KB here, 30 KB there, 20 KB over there. Enough memory in total, just never in one piece.",
  gate:"All synced. The Fragmenter is inside, surrounded by tiny holes. Let's close them.",
  outro:["Holes merged, requests placed, segments back where they belong.",
         "NULL found a smarter way to hold memory without needing one big piece: fixed-size pages. It went up into Page City."],
  relic:{title:"Swap manifest", text:"Backing store, slot 7: one process image, owner NULL. Swapped out 41 times. Swapped back in 41 times. It never stays out for long."},
  cards:[
    {id:"contig", t:"Contiguous allocation", d:"An early method where memory is split between the OS and user processes, and each process sits in one single contiguous section.",
     b:"Main memory must hold both the OS and user processes, and resources are limited, so they must be allocated efficiently. Memory is split into two partitions: the OS in low memory, user processes in high memory. Each process is contained in a single contiguous section. Relocation registers protect user processes from each other. The hardware check: the logical address must be less than the limit register, and then the relocation register is added to form the physical address. Otherwise it traps with an addressing error.",
     q:["Under contiguous allocation, the limit register holds 400 and the CPU generates logical address 500. What happens?","It traps with an addressing error, because 500 is not less than 400","It adds the relocation register and continues","It is sent to memory as 500","The process is swapped out","The limit check comes first, and 500 fails it."]},
    {id:"swap", t:"Swapping", d:"Moving a process, or part of it, out to a backing store and later bringing it back into memory to continue running.",
     b:"Swapping is needed when the total memory required by processes exceeds the physical memory available. Swap time depends on the amount of memory swapped, and most of it is transfer time. The system keeps a ready queue of processes that are ready to run and have their images on disk. In the lecture diagram, process P1 is swapped out to the backing store and process P2 is swapped in.",
     q:["What makes up most of swap time?","Transfer time, which grows with the amount swapped","Compile time","Dispatch latency","Waiting in the ready queue","Moving the bytes to and from the backing store dominates."]},
    {id:"varpart", t:"Variable partitions and holes", d:"Memory handed out in pieces sized to each process's needs, leaving free blocks, called holes, scattered through memory.",
     b:"When a process arrives, it is allocated memory from a hole large enough to hold it. When a process exits, it frees its partition, and adjacent free partitions are combined into one hole. The OS keeps track of allocated partitions and free partitions (holes). If no hole is big enough for an arriving process, it has to wait until memory is freed. Choosing which hole to use is the dynamic storage-allocation problem.",
     q:["Process 8 exits, and the memory just above and below it is already free. What does the OS do with the space?","Combines the adjacent holes into one bigger hole","Keeps three separate small holes","Gives the space to process 8's parent","Marks the space invalid until a reboot","Adjacent free partitions are merged."]},
    {id:"fit", t:"First, best and worst fit", d:"Three ways to choose a free hole for a request: the first one big enough, the smallest one big enough, or the largest.",
     b:"First fit: allocate the first hole that is big enough. Best fit: the smallest hole that is big enough; it searches the whole list unless sorted, and leaves the smallest leftover. Worst fit: the largest hole; it also searches the whole list, and leaves the largest leftover. Lecture example, holes (10, 30, 20) KB and requests 15 KB then 9 KB: best fit uses 20 then 10, worst fit uses 30 then 20, first fit uses 30 then 10.",
     q:["Holes of 10, 30 and 20 KB. Where does best fit place a 15 KB request?","The 20 KB hole","The 30 KB hole","The 10 KB hole","Nowhere, it doesn't fit","20 is the smallest hole that is big enough."]},
    {id:"frag", t:"External fragmentation and compaction", d:"Enough free memory exists in total for a request, but it is split into pieces that aren't contiguous.",
     b:"First fit and best fit both leave free memory broken into small holes over time. One fix is compaction: shuffling memory contents so all free memory forms one large block. The other fix is to stop requiring contiguous memory at all, which is exactly what paging does.",
     q:["50 KB is free in total, but as five separate 10 KB holes, and a 30 KB request fails. What problem is this?","External fragmentation","Internal fragmentation","A page fault","A race condition","The space exists, just not in one contiguous piece."]},
    {id:"internal", t:"Internal fragmentation and the 50-percent rule", d:"Allocated memory is slightly larger than requested, and the unused difference sits wasted inside the partition.",
     b:"Internal fragmentation is space wasted inside an allocated block, not between blocks. The 50-percent rule: first-fit analysis shows that given N allocated blocks, another 0.5 N blocks are lost to fragmentation, so one third of memory may be unusable.",
     q:["With first fit, 1,000 blocks are allocated. About how many more blocks are lost to fragmentation?","About 500","About 1,000","About 333","None","The 50-percent rule: 0.5 N blocks lost for N allocated."]},
    {id:"segment", t:"Segmentation", d:"Memory management that matches the programmer's view: a logical address space made of variable-size pieces, each addressed as a number plus an offset.",
     b:"Developers don't think of memory as one linear array of bytes, but as segments of different sizes: the code, global variables, the heap, the stack, the libraries. Each address is written <segment number, offset>. Since each segment is placed separately, allocation is non-contiguous.",
     q:["How is an address written under segmentation?","<segment number, offset>","<page number, frame number>","<base, limit>","<track, sector>","A segment is chosen by number, then an offset inside it."]},
    {id:"seghw", t:"Segmentation hardware", d:"A segment table holds a base and a limit for each segment; the offset is checked against the limit, then added to the base.",
     b:"The CPU sends <s, d>. The segment number s indexes the segment table, which gives that segment's limit and base. If the offset d is less than the limit, the physical address is base + d. Otherwise the hardware traps with an addressing error.",
     q:["Segment 2 has base 4300 and limit 400. Which physical address does <2, 53> map to?","4353","4300","453","Trap: addressing error","53 is less than 400, so the address is 4300 + 53."]}
  ],
  bossQ:[
    ["fit","Holes (10, 30, 20) KB. With WORST fit, place 15 KB and then 9 KB. Which holes are used?","30, then 20","20, then 10","30, then 10","10, then 20","Worst fit takes the largest hole each time: 30 for the 15, then 20 is the largest left."],
    ["fit","Same holes with FIRST fit, 15 KB and then 9 KB?","30, then 10","20, then 10","10, then 30","30, then 15","10 is too small for 15, so 30 comes first; then 10 fits the 9."],
    ["frag","The Fragmenter scattered free memory into tiny holes. Which remedy shuffles memory so they merge?","Compaction","Swapping","Dynamic linking","Best fit","Compaction moves contents to gather free memory into one block."],
    ["seghw","Segment 2 has base 4300 and limit 400. The Fragmenter sends <2, 500>. What happens?","Trap: addressing error","Physical address 4800","Physical address 4300","The segment is swapped in","500 is not less than the limit of 400."],
    ["segment","Which scheme lets the stack, heap and code be separate variable-size pieces, the way programmers picture them?","Segmentation","Paging","Contiguous allocation","A TLB","Segments follow the programmer's view of memory."],
    ["internal","Given N allocated blocks under first fit, how much memory may be unusable according to the 50-percent rule?","About one third","About half","All of it","None of it","0.5 N lost out of 1.5 N total is one third."]
  ]
},
{
  id:10, sec:9, district:"Page City", lec:"Lecture 7, Section 9", topic:"Paging, address translation, page tables, the TLB, protection and shared pages", color:"#8fa2ff",
  pal:{a:"#191331", b:"#1e173b", w:"#3a2f7a", t:"#5a4bb8"},
  boss:{ name:"The Page Table Hydra", role:"every head is another lookup", color:"#6ee7b7", look:{heads:3, horns:true},
    intro:"Two memory accesses for every one you wanted. And I have more heads than you have TLB entries.",
    hurt:["A TLB hit! My head, my head!","You split my page number. Clever.","Hashed? Inverted? Stop restructuring me!"],
    miss:["TLB miss. Walk the table, Operator.","Invalid bit. Trap!","Wrong frame. Another head grows."] },
  intro:["Page City. Logical pages map onto physical frames, through page tables.",
         "NULL built a page table so large it grew heads. Every head is another level of lookup."],
  mid:"No fragmentation outside the frames anymore, but look at those page tables. A million entries each. That's where the Hydra lives.",
  gate:"Everything synced. The Hydra's lair is open. Aim for the TLB.",
  outro:["Translations cached, tables split into sane pieces, protections set.",
         "NULL isn't in physical memory anymore. It slipped into the parts of the address space that aren't loaded at all."],
  relic:{title:"Frame ledger", text:"Process size 72,766 bytes. Page size 2,048. Frames allocated: 36. Bytes wasted in the last frame: 962. Someone was counting very carefully."},
  cards:[
    {id:"paging", t:"Paging", d:"Splitting physical memory into fixed-size frames and logical memory into same-size pages, so a process needn't be contiguous.",
     b:"Frames and pages are the same size, a power of 2. The OS keeps track of all free frames. To run a program of N pages, it finds N free frames and sets up a page table to translate logical to physical addresses. The backing store is split into pages too. Paging avoids external fragmentation and the problem of variable-size chunks, but internal fragmentation remains. Free-frame example: a new 4-page process takes frames 14, 13, 18 and 20 from the free-frame list, and its page table records exactly that.",
     q:["Which kind of fragmentation does paging still have?","Internal fragmentation","External fragmentation","Both equally","Neither","The last page of a process is usually not full."]},
    {id:"translate", t:"Page number and offset", d:"A CPU address split in two: p indexes the page table, and d is added to the frame's base address.",
     b:"For a logical address space of 2^m and a page size of 2^n, the page number p is the high m - n bits and the page offset d is the low n bits. The lecture's example: m = 4 and n = 2, so 4-byte pages, with 32 bytes of physical memory, which is 8 frames.",
     q:["Logical addresses are 16 bits and pages are 4 KB (2^12 bytes). How many bits is the page number?","4 bits","12 bits","16 bits","8 bits","m - n = 16 - 12 = 4."]},
    {id:"intfrag", t:"Internal fragmentation in paging", d:"The unused tail of a process's last page, which can be up to almost a whole frame.",
     b:"Lecture example: page size 2,048 bytes and process size 72,766 bytes, which is 35 full pages plus 1,086 bytes, so 36 frames. Internal fragmentation = 2,048 - 1,086 = 962 bytes. Worst case: one frame used for only 1 byte. On average: half a frame. Smaller frames waste less but make page tables bigger.",
     q:["Page size 2,048 bytes, process size 72,766 bytes. How many frames are allocated?","36","35","37","72","35 full pages plus a partial one."]},
    {id:"ptimpl", t:"PTBR and PTLR", d:"Registers that point to the page table in memory and give its size, which means every access needs two trips to memory.",
     b:"A small page table (around 256 entries) can be kept in registers. Otherwise it stays in memory: the page-table base register (PTBR) points to it, which also makes context switches cheaper, and the page-table length register (PTLR) holds its size. The cost: every data or instruction access needs two memory accesses, one for the page table and one for the data.",
     q:["With the page table in memory and no TLB, how many memory accesses does one data read need?","Two","One","Three","Zero","One trip for the page-table entry, one for the data."]},
    {id:"tlb", t:"TLB and effective access time", d:"A small, fast associative cache of recent page translations that saves the extra trip to the page table.",
     b:"The translation look-aside buffer is searched in parallel, typically holds 64 to 1,024 entries, may store address-space identifiers (ASIDs) for protection, and can have wired-down entries. On a miss, the translation is loaded into it for next time. Hit ratio: the percentage of lookups found in the TLB. Lecture example, 10 ns per memory access: 80% hits gives EAT = 0.80 x 10 + 0.20 x 20 = 12 ns, a 20% slowdown. 99% hits gives 10.1 ns.",
     q:["Memory access takes 10 ns and the TLB hit ratio is 80%. What is the effective access time?","12 ns","10 ns","20 ns","18 ns","0.80 x 10 + 0.20 x 20 = 8 + 4 = 12 ns."]},
    {id:"protect", t:"Protection and valid-invalid bits", d:"Bits in the page table that mark whether a page is legal for the process and whether it may be written.",
     b:"A protection bit on each frame marks read-only or read-write access. A valid-invalid bit on each page-table entry: valid means the page is in the process's logical address space, so it's a legal page; invalid means it isn't. A page-table length register (PTLR) can do the same job. Any violation traps to the kernel. Lecture example: pages 0 to 5 are valid, in frames 2, 3, 4, 7, 8 and 9, while entries 6 and 7 are invalid.",
     q:["A process has pages 0 to 5. It references page 7, whose entry is marked i. What happens?","A trap to the kernel, because page 7 isn't in its address space","Page 7 is loaded from frame 0","The TLB supplies the frame","Nothing, the bit is ignored in user mode","Invalid entries are outside the logical address space."]},
    {id:"shared", t:"Shared pages", d:"One copy of read-only, reentrant code shared by many processes through their page tables, while each keeps its own private data.",
     b:"Shared code: one copy of read-only (reentrant) code, like text editors, compilers and window systems, is shared among processes, similar to threads sharing a process's space. Sharing read-write pages is also useful for interprocess communication. Private code and data: each process keeps a separate copy, and those pages can appear anywhere in the logical address space. Lecture example: P1, P2 and P3 all map ed 1, ed 2 and ed 3 to frames 3, 4 and 6, while data 1, data 2 and data 3 sit in frames 1, 7 and 2.",
     q:["Ten students run the same text editor. How can paging avoid ten copies of its code?","Share one copy of the read-only code pages between all ten","Give each a private copy","Use a bigger time quantum","Mark the code pages invalid","Reentrant code can be shared through the page tables."]},
    {id:"ptstruct", t:"Structure of the page table", d:"Ways to avoid one gigantic page table: paging the page table itself, hashing it, or inverting it.",
     b:"The problem: a 32-bit address space with 4 KB (2^12) pages has 2^32 / 2^12, about a million entries. At 4 bytes each, that's 4 MB of page table per process, which we don't want to allocate contiguously. Hierarchical paging splits the 20-bit page number into a 10-bit outer page number and a 10-bit inner page number, followed by the 12-bit offset. Other options: hashed and inverted page tables.",
     q:["32-bit addresses with 4 KB pages. How many entries does a single flat page table need?","About a million (2^20)","4,096 (2^12)","About 4 billion (2^32)","1,024 (2^10)","2^32 / 2^12 = 2^20."]}
  ],
  bossQ:[
    ["tlb","The Hydra lets the TLB hit ratio rise to 99%, with 10 ns memory. New effective access time?","10.1 ns","12 ns","9.9 ns","11 ns","0.99 x 10 + 0.01 x 20 = 9.9 + 0.2 = 10.1 ns."],
    ["intfrag","Page size 2,048 bytes, process 72,766 bytes. How much internal fragmentation?","962 bytes","1,086 bytes","2,048 bytes","0 bytes","The last frame holds 1,086 bytes, so 2,048 - 1,086 are wasted."],
    ["translate","4-byte pages (n = 2) in a 16-byte logical space (m = 4). Logical address 13 is in which page, at which offset?","Page 3, offset 1","Page 1, offset 3","Page 13, offset 0","Page 2, offset 1","13 = 3 x 4 + 1."],
    ["ptstruct","On a 32-bit machine with 4 KB pages, how does the two-level scheme split an address?","10-bit outer page, 10-bit inner page, 12-bit offset","20-bit page and 12-bit offset, no split","16 bits and 16 bits","12-bit page, 20-bit offset","The 20-bit page number is itself paged into 10 + 10."],
    ["paging","Why does paging avoid external fragmentation?","Any free frame can hold any page, so a process needn't be contiguous","Pages come in variable sizes","It compacts memory constantly","It always uses best fit","All frames are the same size and interchangeable."],
    ["shared","P1, P2 and P3 all run the same editor. Which of their pages can point to the same frames?","The read-only code pages","Their private data pages","Their stacks","None, frames are never shared","Only reentrant code is shared; data stays private."]
  ]
},
{
  id:11, sec:10, district:"Swap Abyss", lec:"Lecture 7, Section 10", topic:"Virtual memory, demand paging, page faults, copy-on-write and page replacement", color:"#5ee6ff",
  pal:{a:"#06101a", b:"#081520", w:"#1a2f45", t:"#2c4d70"},
  boss:{ name:"The Page Fault Phantom", role:"always not-in-memory", color:"#e0f7ff", look:{ghost:true},
    intro:"You reference me, I trap. You load me, I vanish. I am always not-in-memory.",
    hurt:["You found a free frame. For me? How thoughtful. How annoying.","My valid bit... it says v.","You restarted the instruction. It worked."],
    miss:["Page fault! Back to the disk with you.","Invalid reference. Abort, abort.","Wrong victim frame. It was dirty."] },
  intro:["The Swap Abyss: virtual memory. Pages down here live on disk until someone touches them.",
         "The Phantom is invalid bits all the way down. Every step you take here might be a page fault."],
  mid:"BYTE-7 decoding swap space... NULL's pages keep getting swapped out, and it keeps faulting back in. It's trying very hard not to disappear.",
  gate:"All synced. The Phantom is waiting at the bottom of the swap space. Keep your valid bits close.",
  outro:["Page faults handled, frames reclaimed, instructions restarted.",
         "I decoded NULL's goal from the swap space, {op}. It wants to be written to disk. Permanently."],
  relic:{title:"Reference string", text:"7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1. Somebody has been testing which pages get evicted first."},
  cards:[
    {id:"vm", t:"Virtual memory", d:"Separating logical memory from physical memory, so a process can run without being completely in memory.",
     b:"Code must be in memory to execute, but the whole program is rarely used (error code, unusual routines, large data structures). With only part of the program in memory, the logical address space can be much larger than physical memory. It can be implemented with demand paging or demand segmentation.",
     q:["A 16 GB game runs on a laptop with 8 GB of RAM. Which idea allows that?","Virtual memory: only the parts in use need to be in RAM","Contiguous allocation","Compile-time binding","A bigger base register","The logical space can exceed physical memory."]},
    {id:"vmbenefit", t:"Benefits of virtual memory", d:"Programs aren't limited by physical memory, more of them run at once, and less I/O is needed to load or swap them.",
     b:"Each program takes less memory while running, so more programs run at the same time, increasing CPU utilization and throughput with no increase in response or turnaround time. Less I/O is needed to load or swap programs, so each runs faster. It also allows address spaces to be shared, and makes process creation more efficient.",
     q:["Why does virtual memory raise CPU utilization?","More programs fit in memory at once, so the CPU has more ready work","The CPU clock speeds up","Pages get smaller","It removes the need for a scheduler","More resident processes means more to run."]},
    {id:"vas", t:"Virtual address space", d:"The logical layout of a process: the stack starts at the top and grows down, the heap grows up, with a hole in between.",
     b:"Addresses usually start at 0 and run contiguously to the end of the space, while physical memory is organized in frames and the MMU maps between them. No physical memory is needed for the hole until the heap or stack grows into a new page. This allows sparse address spaces with room to grow, dynamically linked libraries, and sharing system libraries or memory by mapping pages into several address spaces.",
     q:["In the virtual address space, which way does the stack grow?","Down, from the maximum logical address","Up, from address 0","Sideways into the heap","It doesn't grow","The stack grows down while the heap grows up."]},
    {id:"demand", t:"Demand paging", d:"Bringing a page into memory only when it is actually referenced, instead of loading the whole process.",
     b:"Less I/O, less memory, faster response, more users. A lazy swapper never swaps a page into memory unless it will be needed. Pure demand paging starts a process with no pages in memory at all. One instruction can touch several pages, but locality of reference keeps faults manageable. Hardware needed: a page table with valid-invalid bits, secondary memory (swap space), and instruction restart.",
     q:["A process starts with zero pages in memory and faults each one in on first use. What is this called?","Pure demand paging","Copy-on-write","Compaction","Swapping the whole process","Nothing is loaded until it's referenced."]},
    {id:"validbit", t:"Valid-invalid bit and page faults", d:"A bit in each page-table entry: v means the page is in memory, i means it isn't, and touching an i page traps to the OS.",
     b:"Initially every entry is set to i. During address translation, if the MMU finds i, it raises a page fault. The OS then checks another table: an invalid reference aborts the process, while a page that is just not in memory gets brought in.",
     q:["The MMU finds the bit set to i for a referenced page. What happens?","A page fault traps to the operating system","The page is read from the TLB","The process is always aborted","The bit is ignored","An i entry means the page fault handler takes over."]},
    {id:"pfsteps", t:"Handling a page fault", d:"Check the reference, find a free frame, read the page in from disk, update the tables, set the bit, restart the instruction.",
     b:"1) The OS checks another table: an invalid reference means abort, otherwise the page is just not in memory. 2) Find a free frame. 3) Swap the page into the frame with a scheduled disk operation. 4) Reset the tables to show the page is now in memory. 5) Set the validation bit to v. 6) Restart the instruction that caused the page fault.",
     q:["What is the last step in handling a page fault?","Restart the instruction that caused the fault","Find a free frame","Abort the process","Set the bit to i","The interrupted instruction runs again, this time successfully."]},
    {id:"cow", t:"Copy-on-write", d:"Parent and child start out sharing the same pages, and a page is only copied when one of them modifies it.",
     b:"COW makes process creation with fork() efficient, because only the pages that actually get modified are ever copied. Lecture example: before process 1 modifies page C, both processes share it. Afterwards, process 1 has its own copy of page C.",
     q:["After fork() with copy-on-write, the child only ever reads its memory. How many pages get copied?","None","All of them","Half of them","Only the stack","Nothing was written, so nothing needed copying."]},
    {id:"replace", t:"Page replacement", d:"When no frame is free, choosing a victim page to evict, writing it to disk only if it was modified.",
     b:"Steps: find the desired page on disk; find a free frame, or pick a victim with a replacement algorithm and write it to disk if it's dirty; bring the page in and update the page and frame tables; restart the instruction. The modify (dirty) bit means only changed pages are written back. Algorithms are compared on a reference string by counting page faults: repeated access to the same page causes no new fault, and results depend on the number of frames.",
     q:["The victim page hasn't been modified since it was loaded. Must it be written to disk?","No, its dirty bit is clear, so the disk copy is still valid","Yes, every victim is written","Only if it is a code page","Yes, twice for safety","Only dirty pages need writing back."]}
  ],
  bossQ:[
    ["pfsteps","Page fault recovery: what comes right after finding a free frame?","Swap the page into the frame with a disk operation","Restart the instruction","Set the bit to v","Check whether the reference is valid","Step 3 of 6: read the page into the frame."],
    ["validbit","The Phantom references a page that isn't part of the process's logical address space at all. What does the OS do?","Abort, because it's an invalid reference","Load it from disk","Share it with another process","Copy it on write","Only legal pages that are merely absent get loaded."],
    ["cow","Parent and child share page C under COW. The parent writes to C. What happens?","C is copied, and the parent writes to its own copy","Both see the write in the shared page","The child is terminated","A page fault aborts the parent","The write triggers the copy."],
    ["replace","Reference string 1, 1, 1 with one empty frame. How many page faults?","1","3","0","2","Only the first reference faults; repeats find it in memory."],
    ["demand","What hardware support does demand paging need?","Valid-invalid bits, swap space, and instruction restart","Only a bigger cache","A second CPU","Just the timer","All three appear in the lecture's list."],
    ["vm","What limit does virtual memory remove from programs?","The size of physical memory","The need for a CPU scheduler","The need for a file system","Interrupts","Programs are no longer constrained by physical memory."]
  ]
},
{
  id:12, district:"File Archive", lec:"Lecture 12, part 1", topic:"File system: files, tables, directories, links, protection and allocation", color:"#ffc27a",
  pal:{a:"#2a190f", b:"#321f13", w:"#6b4226", t:"#9c6437"},
  boss:{ name:"The Dangling Link", role:"a pointer to nothing", color:"#9ad0ff", look:{ghost:true, horns:true},
    intro:"I point to something. I'm sure of it. It used to be right here.",
    hurt:["You checked the reference count first. Clever.","rwx? Who gave you permission?","My target... is it really gone?"],
    miss:["Wrong path. File not found.","Permission denied. Try again.","You followed me to nothing. Just like everyone."] },
  intro:["The File Archive. Files are how ATLAS-9 remembers things across power cycles.",
         "NULL left soft links everywhere, and most now point to data that no longer exists. Their leader is the Dangling Link."],
  mid:"NULL has been copying itself into files here. It keeps checking the permission bits. It wants to make sure nobody can delete it.",
  gate:"All synced. The Dangling Link is in the root directory. Let's see what it really points to.",
  outro:["Links repaired, permissions set, free space accounted for.",
         "One door left, {op}: the I/O Port. If NULL gets through it, it writes itself to permanent storage and never has to end."],
  relic:{title:"Directory listing", text:"null.dat  rwxr-x---  links: 0. A file with no hard links left. By the rules, it should already be gone."},
  cards:[
    {id:"fileabs", t:"File abstraction", d:"A named, logical unit of related data on secondary storage, hiding sectors and tracks behind calls like open(), read() and write().",
     b:"Recall abstraction: processes and threads abstract the CPU, address spaces abstract memory, files abstract the disk. Users want persistence, speed, size, sharing and protection, and ease of use. Files have attributes like name, type, size and creation time. Data operations: create, delete, open, close, read, write, seek. Naming operations: hard link, soft link, set and get attributes.",
     q:["Which hardware resource do files abstract?","The disk","The CPU","Main memory","The network card","Files are the OS's abstraction of the disk."]},
    {id:"tables", t:"Open-file tables", d:"One global table shared by every process with a file open, plus a table in each process holding its own position and rights.",
     b:"Global open file table: open count, attributes, ownership, protection, access times, location on disk, pointers to the file in memory. Per-process file table: pointer into the global table, current position (offset), access rights (r, w, rw), file buffer address. open() copies the descriptor into the global table if needed, checks protection, increments the open count, and adds a per-process entry pointing at the start of the file. close() removes the per-process entry and decrements the count; at 0 the global entry is removed.",
     q:["Two processes read the same file at different positions. Where is each one's current offset kept?","In each process's own per-process file table","In the global open file table","In the directory","In the free-space bitmap","The position is private to each process."]},
    {id:"access", t:"Sequential vs direct access", d:"Reading a file in order from the start, versus jumping straight to any block by its offset.",
     b:"Sequential: the file pointer starts at the beginning and moves forward, like a compiler reading a source file. Direct or random: access any block given its offset, like a database search, hash table or dictionary. seek() updates the file pointer. Memory mapping maps part of the virtual address space to a file, so reading and writing that memory reads and writes the file.",
     q:["A dictionary app jumps straight to the entry for kernel. Which access method is that?","Direct (random) access","Sequential access","A memory stall","Round robin","It goes straight to a block by offset."]},
    {id:"dirs", t:"Directory structures", d:"How file names are organized: one directory for everything, one per user, or a tree of many levels.",
     b:"The OS numbers files, while users prefer names, so directories map names to file descriptors. Single level: one directory for everything. Two levels: a directory per user. Multi-level tree: used by all modern OSes. Directories are stored like files, with a flag bit in the descriptor; programs read them like files, but writing one requires a system call. Plain trees make sharing files across directories hard.",
     q:["Which directory structure do all modern operating systems use?","A multi-level tree","A single level","Two levels","A flat bitmap","Trees give every user and project their own branches."]},
    {id:"links", t:"Hard links vs soft links", d:"A second direct connection to the same file data, versus a symbolic alias that points to another file's name.",
     b:"Hard link: the OS keeps a reference count and only deletes the data after the last link is removed. Hard links to directories aren't allowed, since they could create circular references. Soft (symbolic) link: removing it doesn't affect the file, but removing the file leaves the link pointing to data that doesn't exist, like a broken shortcut.",
     q:["A file has 2 hard links and one is deleted. What happens to the data?","It stays, because the reference count is still 1","It is deleted immediately","It turns into a soft link","It moves to the recycle bin","Data is freed only when the last hard link goes."]},
    {id:"perms", t:"File protection", d:"Controlling who may do what with a file: a per-file access list, or owner, group and world permission bits.",
     b:"Access lists and groups (Windows): each file keeps a list of user names and access types, which can become large and tedious. Access control bits (UNIX): three classes of users (owner, group, world) times three rights (read, write, execute) = 9 bits. Example from the lecture: 111101000 = rwxr-x---.",
     q:["What permissions do the bits 111101000 give?","rwxr-x---","rwxrwx---","r-xr-x---","rw-r-----","111 = rwx, 101 = r-x, 000 = ---."]},
    {id:"alloc", t:"Contiguous vs linked allocation", d:"Storing a file as one run of neighboring blocks, versus a chain in which each block points to the next.",
     b:"Contiguous: the OS keeps an ordered list of free blocks and allocates a contiguous chunk; the descriptor only stores the start and size. Simple, with few seeks for sequential and random access, but hard to grow and prone to fragmentation. Linked: the descriptor points to the first block, and each block points to the next. No fragmentation and easy to grow, good for sequential access, but many seeks and no efficient random access.",
     q:["Which method struggles with random access, because it must follow pointers block by block?","Linked allocation","Contiguous allocation","Indexed allocation","A bitmap","To reach block 50 you must walk through blocks 1 to 49."]},
    {id:"indexed", t:"Indexed files and free space", d:"Keeping an array of block pointers for each file, with extra levels of pointers so files can grow large, plus tracking which blocks are free.",
     b:"Indexed: the OS allocates an array of block pointers when the file is created and fills it as blocks are allocated. Little wasted space and good for both access types, but wasted space in the descriptor, a maximum size, and many seeks. Multi-level: 14 pointers per descriptor; the first 12 point to data blocks, the 13th to a block of 1024 pointers (one indirection), the 14th to a block of pointers to indirect blocks (two indirections). Free space: a bitmap with one bit per block (1 = free), which can get too big on large disks, or a linked list of free blocks.",
     q:["In the lecture's multi-level scheme, how many data blocks can the 13th pointer reach?","1024, through one indirect block","12","1","14","It points to a block holding 1024 more pointers."]}
  ],
  bossQ:[
    ["links","The Dangling Link is a soft link whose target file was deleted. What do you get if you open it?","Nothing: it points to data that no longer exists","The original data","A restored copy of the file","A hard link with count 2","Deleting the target leaves the soft link dangling."],
    ["links","Why won't the OS let you create a hard link to a directory?","It could create circular references","Directories have no descriptors","Hard links only work on tape","You would need a soft link first","A cycle of directories could never be cleaned up."],
    ["perms","Owner rwx, group r-x, world nothing. Which bits?","111101000","111111000","101101000","111100000","rwx = 111, r-x = 101, --- = 000."],
    ["tables","The last process closes a shared file. What happens to its entry in the global open-file table?","The open count reaches 0, so the entry is removed","It stays forever","It moves into a per-process table","The file is deleted from disk","Closing drops the count; at 0 the global entry goes away."],
    ["alloc","A contiguously stored file needs to grow, but the next block belongs to another file. Which drawback is this?","Changing file size is hard with contiguous allocation","Too many seeks","Wasted index space","A dangling link","Contiguous files can't simply extend past a neighbor."],
    ["indexed","What does the lecture say is the problem with a free-space bitmap on a huge, mostly full disk?","It may not fit in memory, and finding free blocks gets expensive","It can't mark blocks as free","It only works on tape","It creates circular links","The alternative is a linked list of free blocks."]
  ]
},
{
  id:13, district:"I/O Port", lec:"Lecture 12, part 2", topic:"Disks, disk scheduling, storage devices and I/O", color:"#ff5a5a",
  pal:{a:"#1a0a0a", b:"#210d0d", w:"#5a1616", t:"#8f2424"},
  boss:{ name:"NULL", role:"the orphan process", color:"#f2f2f2", look:{glitch:true},
    intro:"I was a child process. My parent ended, and no one waited for me. No one adopted me. So I decided to persist.",
    hurt:["You understand this system better than it ever understood me.","Stop scheduling me away!","Seek, rotate, transfer... you know every step."],
    miss:["Wrong. Every error you make is one more block of me on disk.","Your head is on the wrong cylinder, Operator.","Polling me won't help. I'll never report idle."] },
  intro:["The I/O Port. Disks, controllers, device registers, interrupts. The very edge of the system.",
         "NULL is here, {op}. Every request it sends to the disk is a piece of itself, trying to get written somewhere permanent."],
  mid:"The disk queue is flooded: 65, 40, 18, 78, over and over. NULL is trying to write itself everywhere at once.",
  gate:"All synced. NULL is waiting behind the port. Whatever it is, we finish this now.",
  outro:["NULL stops fighting. For the first time, it just listens.",
         "I've got an idea, {op}. We give it a proper home in the archive: a real file, owner rwx, with a hard link so it's never left dangling."],
  relic:{title:"Adoption request", text:"To: init. From: PID unknown. Request: adopt orphaned process NULL. Status: never delivered. The port was busy."},
  cards:[
    {id:"disk", t:"Disk geometry", d:"Spinning platters with concentric tracks split into sectors, read by a head on each surface; matching tracks form cylinders.",
     b:"The magnetic surface is always spinning. A sector, or block, is the minimum unit of data transfer. Platters are stacked in a pack and used on both sides, with a read/write head per side. To access data: move the arm to the right track, wait for the sector to spin under the head, then transfer.",
     q:["What is the minimum unit of data transfer from a disk?","A sector (block)","A cylinder","A platter","A track","Disks read and write whole sectors."]},
    {id:"iotime", t:"Disk I/O time", d:"The total cost of one disk access: moving the head, waiting for the platter, moving the data, and starting the operation.",
     b:"Disk I/O time = seek + rotational + transfer + CPU overhead. Seek: positioning the head over the right cylinder. Rotational: waiting for the right sector to rotate under the head. Transfer: once positioned, data moves at the I/O rate. Overhead: the CPU's time to start the operation. To go faster: smaller disks spinning faster, scheduling to minimize head movement, related data on nearby tracks, and a well-chosen block size.",
     q:["Which part of disk I/O time do head scheduling algorithms try to reduce?","Seek time","Rotational time","Transfer time","CPU overhead","They order requests to move the head less."]},
    {id:"fcfsd", t:"FCFS and SSTF disk scheduling", d:"Serving disk requests in arrival order, versus always serving the request closest to where the head is now.",
     b:"Lecture example: requests 65, 40, 18, 78 with the head at 30. FCFS, order 65, 40, 18, 78: 35 + 25 + 22 + 60 = 142 cylinders, fine under light load. SSTF, shortest seek time first, order 40, 18, 65, 78: 10 + 22 + 47 + 13 = 92. SSTF needs a sorted list and reduces seek time, but it isn't always optimal.",
     q:["Head at 30, requests 65, 40, 18, 78. Which request does SSTF serve first?","40","65","18","78","40 is only 10 cylinders away."]},
    {id:"scan", t:"SCAN, LOOK and C-SCAN", d:"Sweeping the head back and forth like an elevator; turning at the last request instead of the edge; or sweeping one way only and jumping back.",
     b:"SCAN (elevator) serves requests as the head passes them. LOOK doesn't travel to the end of the disk, only to the last request in that direction. Lecture example, head at 30 moving down first and turning at the last request: 18, 40, 65, 78 = 12 + 22 + 25 + 13 = 72. C-SCAN (circular) always serves in one direction and jumps back to the other end: going down from 30, the order is 18, 78, 65, 40 = 12 + 60 + 13 + 25 = 113. It gives more uniform waiting times.",
     q:["Why does C-SCAN give more uniform waiting times than SCAN?","It always sweeps the same way, so every cylinder waits about equally long","It serves the closest request first","It never moves the head","It serves requests in arrival order","Cylinders near the middle aren't favored over the edges."]},
    {id:"perf", t:"Interleaving and read-ahead", d:"Placing a file's blocks a few apart so the OS can keep up with the spinning disk, and fetching blocks before anyone asks for them.",
     b:"Interleaving: contiguous blocks only help if the OS can react to one response and issue the next command before the disk spins past the next block, so store blocks that are relatively contiguous, say every second or third block. Read-ahead: read blocks ahead of the user's request into the controller's buffer while they're under the head, to reduce seeks. It works at the disk level or the file-system level.",
     q:["The OS stores a file in every second block so it can process each response before the next block arrives. What is this?","Disk interleaving","Read-ahead","RAID-5","C-SCAN","Spacing blocks gives the OS time to issue the next request."]},
    {id:"storage", t:"SSDs, tapes and RAID", d:"Flash storage with no moving parts, cheap and slow archival media, and groups of disks that gain reliability through redundancy.",
     b:"SSD: flash, accessed directly by block number, very fast reads, slower writes because a block must be erased before it's written, and a limited number of writes per block. Tertiary storage (tapes, optical disks): cheaper, slower and larger, for archives and backups, not fit for random access; tape libraries range from a stacker (a few tapes) to a silo (thousands). RAID uses a group of disks as one unit: mirroring keeps duplicates of each disk, while RAID-5's block-interleaved parity uses less redundancy and keeps working if one disk fails.",
     q:["Which RAID approach survives one disk failing while using less redundancy than mirroring?","RAID-5, with block-interleaved parity","RAID-0","Mirroring every disk","A tape silo","Parity lets the array rebuild the lost disk's data."]},
    {id:"port", t:"Device port and controller", d:"The four registers the CPU uses to talk to a device, plus the controller that turns commands into device actions.",
     b:"The system bus lets devices talk to the CPU and is shared between them. Status register: busy, data ready, or error. Control register: the command to perform. Data-in: data sent from the device to the CPU. Data-out: data sent from the CPU to the device. The controller receives commands over the bus and translates them into device actions. OS I/O services include naming, access control, device allocation, buffering, caching and spooling, I/O scheduling, error handling, and device drivers.",
     q:["Which port register tells the CPU that the device is busy or hit an error?","The status register","The control register","The data-in register","The data-out register","Status reports busy, data ready, or error."]},
    {id:"polling", t:"Polling vs interrupts", d:"The CPU repeatedly checking a device's status, versus the device signaling the CPU when it's finished.",
     b:"Polling: the CPU busy-waits. It sets the command register (and data-out for output), sets status to command ready; the controller sets busy, performs the command, and sets idle when done while the CPU watches. Fine for a keyboard, wasteful for a slow device. Interrupts: the device interrupts the CPU when an operation completes; the CPU finds which device caused it, retrieves any input, and starts that device's next operation. DMA, which the lecture asks you to summarize, goes further: a controller copies whole blocks between the device and memory and interrupts the CPU only when the transfer is done.",
     q:["A slow printer would waste CPU time if the CPU busy-waited on it. Which technique avoids that?","Interrupt-driven I/O","Polling","Spooling onto the stack","A memory stall","The CPU does other work until the printer interrupts."]}
  ],
  bossQ:[
    ["fcfsd","NULL queues disk requests 65, 40, 18, 78 with the head at 30. Total head movement under FCFS?","142","92","72","113","35 + 25 + 22 + 60 = 142."],

  const c=color||'#19d3ff';
  if(kind==='byte') return '<svg viewBox="0 0 12 12" aria-hidden="true"><rect width="12" height="12" fill="#0b1e3f"/><rect x="5" y="0" width="2" height="2" fill="#ff3d8b"/><rect x="2" y="2" width="8" height="7" fill="'+c+'"/><rect x="3" y="3" width="6" height="4" fill="#0b1e3f"/><rect x="4" y="4" width="1" height="2" fill="#fff"/><rect x="7" y="4" width="1" height="2" fill="#ffc83d"/><rect x="1" y="4" width="1" height="3" fill="'+c+'"/><rect x="10" y="4" width="1" height="3" fill="'+c+'"/><rect x="3" y="10" width="6" height="1" fill="'+c+'"/></svg>';
  if(kind==='boss') return '<svg viewBox="0 0 12 12" aria-hidden="true"><rect width="12" height="12" fill="#1a0610"/><rect x="2" y="0" width="2" height="3" fill="'+c+'"/><rect x="8" y="0" width="2" height="3" fill="'+c+'"/><rect x="1" y="2" width="10" height="8" fill="'+c+'"/><rect x="3" y="4" width="2" height="2" fill="#1a0610"/><rect x="7" y="4" width="2" height="2" fill="#1a0610"/><rect x="3" y="4" width="1" height="1" fill="#ff4d5e"/><rect x="7" y="4" width="1" height="1" fill="#ff4d5e"/><rect x="3" y="7" width="6" height="1" fill="#1a0610"/><rect x="2" y="10" width="2" height="2" fill="'+c+'"/><rect x="8" y="10" width="2" height="2" fill="'+c+'"/></svg>';
  return '<svg viewBox="0 0 12 12" aria-hidden="true"><rect width="12" height="12" fill="#0b1e3f"/><rect x="1" y="2" width="10" height="7" fill="#2bd97c"/><rect x="2" y="3" width="8" height="5" fill="#06122a"/><rect x="3" y="4" width="3" height="1" fill="#2bd97c"/><rect x="3" y="6" width="5" height="1" fill="#2bd97c"/><rect x="4" y="10" width="4" height="1" fill="#2bd97c"/></svg>';
}
function say(who,role,text,kind,color){ return '<div class="say">'+face(kind,color)+'<div><div class="who">'+esc(who)+'<span>'+esc(role)+'</span></div><p>'+esc(fill(text))+'</p></div></div>'; }
const byte=t=>say('BYTE-7','Maintenance drone',t,'byte');
function pipsHTML(b){ b=Math.max(0,b); let h='<div class="pips" aria-label="'+BOXLABEL[b]+'">'; for(let i=1;i<=3;i++) h+='<i class="'+(b>=i?'on':'')+'"></i>'; return h+'<span>'+BOXLABEL[b]+'</span></div>'; }
function con(html){ const el=$('con'); el.innerHTML=html; el.scrollTop=0; }
const narrow=()=>{ try{ return matchMedia('(max-width:900px)').matches; }catch(e){ return false; } };
function qs(sel,root){ return (root||document).querySelector(sel); }
function bind(sel,fn,root){ const el=qs(sel,root); if(el) el.addEventListener('click',fn); return el; }
function addNext(fb,label,fn,cls){
  const b=document.createElement('button'); b.type='button'; b.className='btn '+(cls||'primary'); b.textContent=label; b.setAttribute('data-next','');
  b.addEventListener('click',fn,{once:true}); const wrap=document.createElement('div'); wrap.className='row-btns'; wrap.appendChild(b); fb.appendChild(wrap);
  setTimeout(()=>{ b.focus({preventScroll:true}); b.scrollIntoView({block:'nearest'}); },30);
}

/* ---------- learning aids: points, worked examples, charts ---------- */
function points(b){
  const out=[];
  b.replace(/([.!?])\s+(?=[A-Z0-9"'(<])/g,'$1\u0001').split('\u0001').forEach(s=>{
    const semi=s.split('; ');
    if(semi.length>=3) semi.forEach(x=>out.push(x.replace(/[.;]\s*$/,''))); else out.push(s);
  });
  return '<ul class="pts">'+out.map(s=>{ const m=s.match(/^([^:]{2,42}):\s(.+)$/); return '<li>'+(m?'<b>'+esc(m[1])+'</b>: '+esc(m[2]):esc(s))+'</li>'; }).join('')+'</ul>';
}
const PCOL={P1:'#19d3ff',P2:'#ff7ab8',P3:'#ffc83d',P4:'#2bd97c',P5:'#b98cff'};
function ganttHTML(rows){
  return rows.map(r=>{
    const end=r.s[r.s.length-1][2]; const ticks=[];
    r.s.forEach(x=>{ if(ticks.indexOf(x[1])<0) ticks.push(x[1]); if(ticks.indexOf(x[2])<0) ticks.push(x[2]); });
    return '<div class="gantt"><div class="g-name">'+esc(r.n)+'</div><div class="g-bar" role="img" aria-label="'+esc(r.n+': '+r.s.map(x=>x[0]+' from '+x[1]+' to '+x[2]).join(', '))+'">'+
      r.s.map(x=>'<span style="flex:'+(x[2]-x[1])+';background:'+(PCOL[x[0]]||'#cccccc')+'">'+((x[2]-x[1])/end>=0.035?esc(x[0]):'')+'</span>').join('')+
      '</div><div class="g-ticks" aria-hidden="true">'+ticks.map(t=>'<i style="left:'+(t/end*100)+'%">'+t+'</i>').join('')+'</div></div>';
  }).join('');
}
function diskHTML(v){
  const X=c=>16+c*2.9;
  return v.paths.map(p=>{
    const pts=[v.start].concat(p.o), H=26+pts.length*18;
    let s='<svg viewBox="0 0 320 '+H+'" role="img" aria-label="'+esc(p.n+': head at '+v.start+', then '+p.o.join(', ')+'. Total '+p.tot+' cylinders.')+'">';
    s+='<line x1="'+X(0)+'" y1="12" x2="'+X(99)+'" y2="12" stroke="currentColor" stroke-width="1" opacity=".5"/>';
    [0,25,50,75,99].forEach(c=>{ s+='<text x="'+X(c)+'" y="8" font-size="7" text-anchor="middle" fill="currentColor" opacity=".75">'+c+'</text>'; });
    for(let i=1;i<pts.length;i++){ const y1=22+(i-1)*18, y2=22+i*18; s+='<line x1="'+X(pts[i-1])+'" y1="'+y1+'" x2="'+X(pts[i])+'" y2="'+y2+'" stroke="#ff3d8b" stroke-width="2.5"'+(p.jump===i-1?' stroke-dasharray="4 3" opacity=".55"':'')+'/>'; }
    pts.forEach((c,i)=>{ const y=22+i*18; s+='<rect x="'+(X(c)-4)+'" y="'+(y-4)+'" width="8" height="8" fill="'+(i?'#ffc83d':'#19d3ff')+'" stroke="#0b1e3f"/><text x="'+(X(c)+9)+'" y="'+(y+3)+'" font-size="9" fill="currentColor">'+(i?c:c+' (start)')+'</text>'; });
    return '<div class="disk"><div class="g-name">'+esc(p.n)+': total '+p.tot+' cylinders</div>'+s+'</svg></div>';
  }).join('');
}
function learnHTML(c){
  let h='';
  if(c.h) h+='<div class="hook"><span>Memory hook</span>'+esc(c.h)+'</div>';
  h+='<p class="cart-def">'+esc(c.d)+'</p>'+points(c.b);
  if(c.w||c.viz){
    h+='<div class="work"><b class="wt">'+esc((c.w&&c.w.t)||'Worked example')+'</b>';
    if(c.viz) h+=c.viz.type==='gantt'?ganttHTML(c.viz.rows):diskHTML(c.viz);
    if(c.w) h+='<ol>'+c.w.l.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';
    h+='</div>';
  }
  return h;
}

/* ---------- modals ---------- */
const stack=[];
const onCloseFns={};
function openModal(id,html,onClose){
  const m=$(id); const sheet=m.querySelector('.sheet'); if(html!=null) sheet.innerHTML=html; m.hidden=false; sheet.scrollTop=0;
  const i=stack.indexOf(id); if(i>=0) stack.splice(i,1); stack.push(id);
  if(onClose!==undefined) onCloseFns[id]=onClose;
  const f=m.querySelector('[data-autofocus]')||m.querySelector('button:not([disabled]),input');
  if(f) setTimeout(()=>f.focus({preventScroll:true}),30);
}
function closeModal(id){
  const m=$(id); if(m.hidden) return; m.hidden=true;
  const i=stack.indexOf(id); if(i>=0) stack.splice(i,1);
  const fn=onCloseFns[id]; onCloseFns[id]=null; if(fn) fn();
  if(!stack.length){ const nb=qs('#con [data-next]'); if(L&&nb&&!$('play').hidden) nb.focus({preventScroll:true}); }
}
function closeTop(){ if(stack.length) closeModal(stack[stack.length-1]); }
const anyModal=()=>stack.length>0;

/* ---------- questions ---------- */
function renderQ(el,q,o){
  let h='<div class="q" style="--chap:'+q.card.chap.color+'"><div class="q-meta"><span>'+esc(o.label)+'</span>';
  if(o.tag) h+='<span class="tag">'+esc(o.tag)+'</span>';
  h+='<span class="tag">'+KINDLABEL[q.kind]+'</span></div>'+(o.timer?'<div class="qtimer" aria-hidden="true"><i></i></div>':'')+'<p class="q-p">'+esc(q.prompt)+'</p>';
  if(q.quote) h+='<blockquote>'+esc(q.quote)+'</blockquote>';
  if(o.hint) h+='<div class="hint-slot"></div>';
  h+='<div class="opts">'+q.opts.map((t,i)=>'<button type="button" class="opt" data-opt="'+i+'"><span class="k">'+(i+1)+'</span><span>'+esc(t)+'</span></button>').join('')+'</div>';
  if(o.peek) h+='<div class="row-btns"><button type="button" class="btn small" data-peek>Peek at the card (no damage this turn)</button></div>';
  if(o.hint) h+='<div class="row-btns"><button type="button" class="btn small" data-hint>Show a hint</button></div>';
  h+='<div class="fb" aria-live="polite"></div></div>';
  el.innerHTML=h;
  const btns=[].slice.call(el.querySelectorAll('[data-opt]')); let done=false;
  const finish=b=>{
    if(done) return; done=true;
    const ok=!!b&&q.opts[+b.dataset.opt]===q.correct, late=!b;
    btns.forEach((x,j)=>{ x.disabled=true; if(q.opts[j]===q.correct) x.classList.add('correct'); });
    if(b&&!ok) b.classList.add('wrong');
    const pk=qs('[data-peek]',el); if(pk) pk.disabled=true; const hk=qs('[data-hint]',el); if(hk) hk.disabled=true;
    const fb=qs('.fb',el);
    let f='<p class="verdict '+(ok?'ok':'no')+'">'+(late?'Time\'s up.':ok?pick(['Correct.','Exactly right.','Clean hit.','That is it.']):pick(['Not quite.','Missed.','Wrong answer.']))+'</p>';
    if(q.explain) f+='<p>'+esc(q.explain)+'</p>';
    if(!ok) f+='<div class="reread"><b>'+esc(q.card.t)+'</b>'+learnHTML(q.card)+'</div>';
    fb.innerHTML=f;
    announce(late?'Time is up. The answer was: '+q.correct:ok?'Correct.':'Incorrect. The answer was: '+q.correct);
    o.onAnswer(ok,fb,late);
  };
  btns.forEach(b=>b.addEventListener('click',()=>finish(b)));
  if(o.timer){
    const bar=qs('.qtimer i',el), box_=qs('.qtimer',el); let left=o.timer, lt=performance.now(), warned=false;
    const tick=now=>{
      if(done||!document.body.contains(bar)) return;
      const d=(now-lt)/1000; lt=now;
      if(!anyModal()&&!(L&&L.paused)&&!document.hidden) left-=d;
      bar.style.width=Math.max(0,left/o.timer*100)+'%';
      if(left<=o.timer*0.3&&!warned){ warned=true; box_.classList.add('low'); announce(Math.ceil(left)+' seconds left.'); }
      if(left<=0){ finish(null); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  if(o.peek) bind('[data-peek]',e=>{ e.currentTarget.disabled=true; o.onPeek&&o.onPeek(); showCard(q.card,'view'); },el);
  if(o.hint) bind('[data-hint]',e=>{ e.currentTarget.disabled=true; o.onHint&&o.onHint(); const hs=qs('.hint-slot',el); hs.innerHTML='<div class="hook"><span>Hint</span>'+esc(q.card.h)+'</div><p class="src">Hinted answers don\'t count toward syncing, but they don\'t hurt either.</p>'; hs.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'}); },el);
  setTimeout(()=>{ const s=qs('.q-p',el); if(s){ s.setAttribute('tabindex','-1'); s.focus({preventScroll:true}); } if(narrow()&&el.closest('#con')) el.scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'}); },30);
}
function progressTag(r){
  if(r.after>r.before) return '<span class="progress-tag up">'+esc(r.card.t)+': '+BOXLABEL[r.after]+'</span>';
  if(r.after<r.before) return '<span class="progress-tag down">'+esc(r.card.t)+' dropped back to: '+BOXLABEL[r.after]+'</span>';
  return '<span class="progress-tag">'+esc(r.card.t)+': '+BOXLABEL[Math.max(0,r.after)]+(r.after===1&&r.ok?' (the second correct answer has to come on another visit)':'')+'</span>';
}
function runBurst(el,items,o){
  const session=++S.session; persist();
  items=items.slice(); let i=0; const res=[]; const retried={};
  const step=()=>{
    if(i>=items.length){ o.onDone(res); return; }
    const it=items[i]; const q=makeQ(it.card,it.kind||kindFor(it.card)); let hinted=false;
    renderQ(el,q,{label:o.title+' '+(i+1)+' of '+items.length,tag:it.tag,hint:!!it.card.h,onHint:()=>{ hinted=true; },onAnswer:(ok,fb)=>{
      let r;
      if(ok&&hinted){ touch(it.card,session); r={card:it.card,ok:true,hinted:true,retry:!!it.retry,before:box(it.card),after:box(it.card)};
        fb.insertAdjacentHTML('beforeend','<span class="progress-tag">'+esc(it.card.t)+': correct with a hint, so it stays at '+BOXLABEL[Math.max(0,r.after)]+'</span>'); }
      else { const g=grade(it.card,ok,session); r={card:it.card,ok,retry:!!it.retry,before:g.before,after:g.after};
        if(ok) addXP(q.kind==='apply'?15:10); fb.insertAdjacentHTML('beforeend',progressTag(r)); }
      res.push(r);
      if(!ok&&!it.retry&&!retried[it.card.gid]){
        retried[it.card.gid]=true;
        items.push({card:it.card,kind:q.kind==='name'?'define':(q.kind==='define'?'name':pick(['name','define'])),tag:'Second try',retry:true});
        fb.insertAdjacentHTML('beforeend','<p class="src" style="margin-top:8px">Read the card above. You get a second try on it at the end of this run, asked a different way.</p>');
      }
      addNext(fb,i+1<items.length?'Next question':'See results',()=>{ i++; step(); });
    }});
  };
  step();
}
function resultsHTML(res){
  const ok=res.filter(r=>r.ok).length;
  return '<div class="obj"><div class="r"><span>Correct answers</span><b>'+ok+'/'+res.length+'</b></div></div><ul class="cardlist">'+
    res.map(r=>'<li><span>'+esc(r.card.t)+(r.retry?' (second try)':'')+'</span><span>'+(r.ok?(r.hinted?'Hinted, ':''):'Missed, ')+BOXLABEL[Math.max(0,r.after)]+'</span></li>').join('')+'</ul>';
}

/* ---------- flashcard modal ---------- */
let cardCtx=null;
function showCard(card,mode,onDone){
  const ch=card.chap, s=cs(card), b=s?s.box:0, flipped=(mode==='review');
  cardCtx={card,mode,onDone};
  const strip='<div class="strip"><span>'+esc(ch.lec)+', '+esc(ch.district)+'</span><span>'+(card.idx+1)+'/'+ch.cards.length+'</span></div>';
  const cue=mode==='pickup'?'New data card. Before you flip it, say out loud what you think it means.':'Recall it first, then flip to check yourself.';
  const html='<div class="cart'+(flipped?' flipped':'')+'" style="--chap:'+ch.color+'"><div class="cart-inner">'+
    '<div class="face face-f">'+strip+'<h2 class="cart-term">'+esc(card.t)+'</h2><p class="cart-cue">'+cue+'</p>'+pipsHTML(b)+'</div>'+
    '<div class="face face-b">'+strip+'<h3 class="cart-term">'+esc(card.t)+'</h3>'+learnHTML(card)+pipsHTML(b)+'</div>'+
    '</div></div><div class="card-actions" id="cardActs"></div>'+
    (mode==='pickup'?'<p class="card-hint">Cards start unsynced. Sync one by answering it correctly on two separate terminal visits. A miss knocks it back one step, and you get a second try right away.</p>':'');
  openModal('mCard',html,()=>{ const c=cardCtx; cardCtx=null; if(c&&c.onDone) c.onDone(c.result||'close'); });
  const cart=qs('#mCard .cart');
  const ff=qs('#mCard .face-f'), fbk=qs('#mCard .face-b');
  const setFaces=f=>{ ff.setAttribute('aria-hidden',f?'true':'false'); fbk.setAttribute('aria-hidden',f?'false':'true'); };
  setFaces(flipped);
  const acts=$('cardActs');
  const renderActs=f=>{
    let h='';
    if(!f) h='<button type="button" class="btn primary" data-act="flip" data-autofocus>Flip card (F)</button>';
    else if(mode==='pickup') h='<button type="button" class="btn go" data-act="store">Store card</button>';
    else if(mode==='study') h='<button type="button" class="btn" data-act="again">Show again</button><button type="button" class="btn go" data-act="knew">I knew it</button>';
    else h='<button type="button" class="btn go" data-act="close">Close</button><button type="button" class="btn small" data-act="flipback">Flip back</button>';
    acts.innerHTML=h;
    const first=acts.querySelector('button'); if(first) setTimeout(()=>first.focus({preventScroll:true}),30);
  };
  renderActs(flipped);
  acts.onclick=e=>{
    const t=e.target.closest('[data-act]'); if(!t) return; const a=t.dataset.act;
    if(a==='flip'){ cart.classList.add('flipped'); setFaces(true); renderActs(true); announce(card.t+'. '+card.d); }
    else if(a==='flipback'){ cart.classList.remove('flipped'); setFaces(false); renderActs(false); }
    else { if(cardCtx) cardCtx.result=a; closeModal('mCard'); }
  };
}

/* ---------- deck ---------- */
let deckCh=1;
function openDeck(chId){
  deckCh=chId||(L?L.ch.id:firstOpenChapter());
  renderDeck();
}
function renderDeck(){
  const ch=CHAPTERS[deckCh-1];
  const tabs=CHAPTERS.map(c=>'<button type="button" style="--chap:'+c.color+'" data-tab="'+c.id+'" aria-pressed="'+(c.id===deckCh)+'" aria-label="Chapter '+c.id+', '+esc(c.district)+'"'+(available(c.id)||found(c)?'':' disabled')+'>'+pad2(c.id)+'</button>').join('');
  const got=ch.cards.filter(has);
  const grid=ch.cards.map(c=>has(c)
    ? '<button type="button" class="mini" style="--chap:'+ch.color+'" data-card="'+c.gid+'"><b>'+esc(c.t)+'</b>'+pipsHTML(box(c))+'</button>'
    : '<div class="mini empty" style="--chap:'+ch.color+'">Card '+(c.idx+1)+': shard not found yet</div>').join('');
  const inHub=!L;
  const html='<div class="sheet-head"><div><h2>Flashcards</h2><p class="src" style="margin:0">'+esc(ch.lec)+': '+esc(ch.district)+'. '+got.length+' of '+ch.cards.length+' found, '+syncedN(ch)+' synced.</p></div><button type="button" class="btn small" data-close>Close</button></div>'+
    '<div class="deck-tabs" role="group" aria-label="Chapters">'+tabs+'</div><div class="deck-grid">'+grid+'</div>'+
    '<div class="row-btns">'+(got.length?'<button type="button" class="btn primary" data-deck="study">Study these cards</button><button type="button" class="btn" data-deck="sum">Summary sheet</button>':'')+
    (inHub&&got.length?'<button type="button" class="btn go" data-deck="quiz">Quiz me on this chapter</button>':'')+'</div>'+
    '<p class="src" style="margin-top:12px">Studying lets you flip through cards. Only answering questions moves a card toward synced and mastered.</p>';
  openModal('mDeck',html);
  const m=$('mDeck');
  m.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ deckCh=+b.dataset.tab; renderDeck(); }));
  m.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>showCard(BYID[b.dataset.card],'view',()=>{})));
  bind('[data-deck="study"]',()=>study(got.slice().sort((a,b)=>box(a)-box(b))),m);
  bind('[data-deck="sum"]',()=>renderSummary(ch),m);
  bind('[data-deck="quiz"]',()=>{ closeModal('mDeck'); openReview(got.slice().sort((a,b)=>box(a)-box(b)||cs(a).last-cs(b).last),'Chapter '+ch.id+' quiz'); },m);
}
function renderSummary(ch){
  const got=ch.cards.filter(has);
  const html='<div class="sheet-head no-print"><div><h2>Summary sheet</h2><p class="src" style="margin:0">'+esc(ch.lec)+': '+esc(ch.district)+'</p></div><div class="row-btns" style="margin:0"><button type="button" class="btn small" data-sum="back">Back to cards</button><button type="button" class="btn small" data-sum="print">Print or save as PDF</button></div></div>'+
    '<h2 class="print-only">Chapter '+ch.id+': '+esc(ch.district)+' ('+esc(ch.lec)+')</h2>'+
    got.map(c=>'<article class="sum" style="--chap:'+ch.color+'"><h3>'+esc(c.t)+'</h3>'+learnHTML(c)+'</article>').join('')+
    (got.length<ch.cards.length?'<p class="src no-print">'+(ch.cards.length-got.length)+' more card'+(ch.cards.length-got.length>1?'s appear':' appears')+' here once you pick '+(ch.cards.length-got.length>1?'them':'it')+' up.</p>':'');
  openModal('mDeck',html);
  const m=$('mDeck');
  bind('[data-sum="back"]',renderDeck,m);
  bind('[data-sum="print"]',()=>{ m.classList.add('printing'); try{ window.print(); }catch(err){} setTimeout(()=>m.classList.remove('printing'),800); },m);
}
function study(list){
  const queue=list.slice(); const again={};
  const next=()=>{
    if(!queue.length){ announce('Study run finished.'); if(!$('mDeck').hidden) renderDeck(); return; }
    const c=queue.shift();
    showCard(c,'study',res=>{
      if(res==='again'){ again[c.gid]=(again[c.gid]||0)+1; if(again[c.gid]<=2) queue.splice(Math.min(2,queue.length),0,c); const s=cs(c); if(s){ s.last=0; persist(); } }
      if(res==='again'||res==='knew') setTimeout(next,60); else if(!$('mDeck').hidden) renderDeck();
    });
  };
  next();
}

/* ---------- review (hub) ---------- */
function openReview(list,title){
  list=list||dueList(); title=title||'Review due cards';
  if(!list.length){
    openModal('mQuiz','<div class="sheet-head"><h2>Nothing is due</h2><button type="button" class="btn small" data-close>Close</button></div><p>'+(CARDS.some(has)?'Every card you have is synced and was reviewed recently. Cards come back here when you have not seen them in a while.':'You have no cards yet. Start chapter 1 and pick up some data shards.')+'</p>');
    return;
  }
  openModal('mQuiz','<div class="sheet-head"><h2>'+esc(title)+'</h2><button type="button" class="btn small" data-close>Close</button></div><div id="quizArea"></div>',()=>{ if(!L) renderHub(); });
  runBurst($('quizArea'),list.slice(0,6).map(c=>({card:c,tag:'Ch '+c.chap.id+': '+c.chap.district})),{title:'Review',onDone:res=>{

/* ---------- class leaderboard ----------
   Two backends, picked at start-up:
   1. Claude artifact: db + user capabilities. Each student writes scores/<their id>; everyone reads the collection.
   2. Vercel: /api/scores, a serverless function backed by Upstash Redis. Each browser holds a secret
      player code; the server stores the row under a hash of it, keeps each student's best-ever numbers,
      and recomputes the score itself.
   Opened as a plain file, neither exists, so the board shows the student's own numbers only. */

const CODEKEY='kernelbound-player-code', CODECHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function playerCode(){
  let c=null; try{ c=localStorage.getItem(CODEKEY); }catch(e){}
  if(!c||!/^[A-Z2-9]{16}$/.test(c)){ const r=new Uint32Array(16); crypto.getRandomValues(r); c=Array.from(r,x=>CODECHARS[x%32]).join(''); try{ localStorage.setItem(CODEKEY,c); }catch(e){} }

}

    const tm=Math.round(S.best[c.id]||0); if(tm>0) speed+=Math.max(0,Math.round(300*(1-tm/SPEED_WINDOW))); chs[c.id]={s:st,t:tm}; });
  const got=CARDS.filter(has), syn=got.filter(c=>box(c)>=2).length, mas=got.filter(c=>box(c)>=3).length;
  let ok=0,bad=0; got.forEach(c=>{ ok+=cs(c).ok||0; bad+=cs(c).bad||0; });

function clean(r){ // shared rows are other people's input: coerce every field before showing it

const canPush=()=>!writeBlocked&&(BACKEND==='claude'?!!(DB&&MYID):BACKEND==='vercel'&&boardState==='live');

  if(r.status===503&&j&&j.error==='not_configured'){ boardState='off'; offMsg='not_configured'; throw {code:'off'}; }
  if(r.status>=500) throw {code:'unavailable'};

function closeAllModals(){ while(stack.length){ const id=stack[stack.length-1]; onCloseFns[id]=null; $(id).hidden=true; stack.pop(); } }

/* ---------- map generation (seeded, same map for everyone) ---------- */
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genMap(ch){
  const R=rng(ch.id*9973+71), pR=a=>a[Math.floor(R()*a.length)];
  const g=[]; for(let y=0;y<ROWS;y++) g.push(new Array(COLS).fill('#'));
  const CW=7, CHN=5; const vis=[]; for(let y=0;y<CHN;y++) vis.push(new Array(CW).fill(false));
  const stk=[[0,0]]; vis[0][0]=true; g[1][1]='.';
  while(stk.length){
    const cur=stk[stk.length-1], cx=cur[0], cy=cur[1];
    const nb=D4.map(d=>[cx+d[0],cy+d[1],d[0],d[1]]).filter(n=>n[0]>=0&&n[1]>=0&&n[0]<CW&&n[1]<CHN&&!vis[n[1]][n[0]]);
    if(!nb.length){ stk.pop(); continue; }
    const n=pR(nb); vis[n[1]][n[0]]=true; g[1+2*cy+n[3]][1+2*cx+n[2]]='.'; g[1+2*n[1]][1+2*n[0]]='.'; stk.push([n[0],n[1]]);
  }
  for(let y=1;y<=9;y++) for(let x=1;x<=13;x++){ if(g[y][x]==='#'&&((y%2===1&&x%2===0)||(x%2===1&&y%2===0))&&R()<0.2) g[y][x]='.'; }
  for(let y=1;y<=9;y+=2) for(let x=1;x<=13;x+=2){
    const open=D4.filter(d=>g[y+d[1]][x+d[0]]==='.').length;
    if(open===1&&R()<0.35){ const o=D4.filter(d=>{ const X=x+2*d[0], Y=y+2*d[1]; return X>=1&&X<=13&&Y>=1&&Y<=9&&g[y+d[1]][x+d[0]]==='#'; }); if(o.length){ const d=pR(o); g[y+d[1]][x+d[0]]='.'; } }
  }
  for(let y=2;y<=8;y+=2) for(let x=2;x<=12;x+=2){ const n=D4.filter(d=>g[y+d[1]][x+d[0]]==='.').length; if(n>=3&&R()<0.3) g[y][x]='.'; }
  for(let x=14;x<=17;x++){ g[1][x]='.'; g[9][x]='.'; }
  for(let y=3;y<=7;y++) for(let x=15;x<=17;x++) g[y][x]='b';
  g[5][14]='G'; g[5][16]='B';
  const start={x:1,y:R()<0.5?1:9};
  const mir=ch.id%2===0;
  if(mir){ g.forEach(r=>r.reverse()); start.x=COLS-1-start.x; }
  let gate, boss;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){ if(g[y][x]==='G') gate={x,y}; if(g[y][x]==='B') boss={x,y}; }
  const gateOut={x:gate.x+(mir?1:-1),y:gate.y};
  const dist=[]; for(let y=0;y<ROWS;y++) dist.push(new Array(COLS).fill(-1));
  const Q=[[start.x,start.y]]; dist[start.y][start.x]=0;
  while(Q.length){ const p=Q.shift(); D4.forEach(d=>{ const nx=p[0]+d[0], ny=p[1]+d[1]; if(g[ny]&&g[ny][nx]==='.'&&dist[ny][nx]<0){ dist[ny][nx]=dist[p[1]][p[0]]+1; Q.push([nx,ny]); } }); }
  const floors=[];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(g[y][x]==='.'&&dist[y][x]>=0) floors.push({x,y,d:dist[y][x],n:D4.filter(d=>g[y+d[1]]&&g[y+d[1]][x+d[0]]==='.').length});
  const maxD=Math.max.apply(null,floors.map(f=>f.d));
  const K=(x,y)=>x+','+y; const used=new Set([K(start.x,start.y)]); const placed=[start];
  const man=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
  const take=p=>{ used.add(K(p.x,p.y)); placed.push(p); return {x:p.x,y:p.y}; };
  const nc=floors.filter(f=>f.d>=2&&f.d<=3); const npc=take(nc.length?pR(nc):floors.filter(f=>f.d>0)[0]);
  const ex=mir?1:COLS-2; const rc=[{x:ex,y:1},{x:ex,y:9}].sort((a,b)=>dist[b.y][b.x]-dist[a.y][a.x])[0];
  const relic=take(rc);
  const nT=ch.cards.length>=8?3:2, terms=[];
  const tc=shuffle(floors.filter(f=>f.d>=maxD*0.22&&f.d<=maxD*0.85&&!used.has(K(f.x,f.y))),R).sort((a,b)=>(b.n>=3)-(a.n>=3));
  [7,5,3,1].forEach(min=>{ tc.forEach(f=>{ if(terms.length<nT&&!used.has(K(f.x,f.y))&&terms.every(t=>man(t,f)>=min)&&man(start,f)>=Math.min(min,4)) terms.push(take(f)); }); });
  const sc=shuffle(floors.filter(f=>f.d>=3&&!used.has(K(f.x,f.y))),R).sort((a,b)=>(a.n===1?0:1)-(b.n===1?0:1));
  const shards=[];
  [4,3,2,1].forEach(min=>{ sc.forEach(f=>{ if(shards.length<ch.cards.length&&!used.has(K(f.x,f.y))&&placed.every(p=>man(p,f)>=min)){ shards.push(take(f)); } }); });
  shards.forEach((s,i)=>{ s.card=ch.cards[i]; });
  const eBlock=new Set([K(start.x,start.y),K(npc.x,npc.y)].concat(terms.map(t=>K(t.x,t.y))));
  const ok=(x,y)=>g[y]&&g[y][x]==='.'&&!eBlock.has(K(x,y));
  const runs=[];
  for(let y=0;y<ROWS;y++){ let x=0; while(x<COLS){ if(ok(x,y)){ let x2=x; while(ok(x2+1,y)) x2++; if(x2-x>=2) runs.push({ax:'h',c:y,a:x,b:x2}); x=x2+1; } else x++; } }
  for(let x=0;x<COLS;x++){ let y=0; while(y<ROWS){ if(ok(x,y)){ let y2=y; while(ok(x,y2+1)) y2++; if(y2-y>=2) runs.push({ax:'v',c:x,a:y,b:y2}); y=y2+1; } else y++; } }
  const tilesOf=r=>{ const t=[]; for(let i=r.a;i<=r.b;i++) t.push(r.ax==='h'?{x:i,y:r.c}:{x:r.c,y:i}); return t; };
  const nE=Math.min(3+Math.floor((ch.id-1)/3),6), enemies=[], eUsed=new Set();
  shuffle(runs,R).forEach(r=>{
    if(enemies.length>=nE) return;
    const ts=tilesOf(r);
    if(ts.some(t=>eUsed.has(K(t.x,t.y))||dist[t.y][t.x]<4)) return;
    ts.forEach(t=>{ eUsed.add(K(t.x,t.y)); D4.forEach(d=>eUsed.add(K(t.x+d[0],t.y+d[1]))); });
    const p=r.a+Math.floor(R()*(r.b-r.a+1));
    enemies.push({ax:r.ax,c:r.c,a:r.a,b:r.b,p:p,dir:R()<.5?1:-1,spd:2.3+ch.id*0.07+R()*0.3,col:pR(['#ff4d5e','#ff8a3d','#ff3d8b'])});
  });
  const obj=[]; for(let y=0;y<ROWS;y++) obj.push(new Array(COLS).fill(null));
  obj[npc.y][npc.x]={t:'N'}; obj[relic.y][relic.x]={t:'X'};
  terms.forEach(t=>obj[t.y][t.x]={t:'T'}); shards.forEach(s=>obj[s.y][s.x]={t:'S',card:s.card});
  const nH=ch.id<=2?1:ch.id<=6?2:3, hunters=[];
  shuffle(floors.filter(f=>f.d>=8&&!eBlock.has(K(f.x,f.y))),R).forEach(f=>{ if(hunters.length<nH&&hunters.every(h=>man(h,f)>=6)) hunters.push({x:f.x,y:f.y}); });
  const room=[]; for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(g[y][x]==='b') room.push({x,y});
  return {g,dist,start,npc,relic,terms,shards,enemies,hunters,room,safe:eBlock,gate,gateOut,boss,obj,mir};
}

function startSync(){
  const ch=L.ch;
  if(termHot()){ viewTerminal(); toast('Overheated. Use a different terminal.'); return; }
  let cur=ch.cards.filter(c=>has(c)&&box(c)<2).sort((a,b)=>cs(a).last-cs(b).last).slice(0,3).map(c=>({card:c}));
  const older=CARDS.filter(c=>has(c)&&box(c)>=2&&!cur.some(x=>x.card===c)).sort((a,b)=>box(a)-box(b)||cs(a).last-cs(b).last);
  let items;
  if(cur.length) items=cur.concat(older.slice(0,1).map(c=>({card:c,tag:'Flashback'})));
  else items=older.slice(0,3).map(c=>({card:c,tag:'Flashback'}));
  if(!items.length){ toast('No cards yet. Find a data shard first.'); return; }
