<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kernelbound: The Null Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --page:#cfe6ff; --grid:rgba(11,30,63,.075); --panel:#ffffff; --panel2:#eef6ff;
  --ink:#0b1e3f; --muted:#45597b; --line:#0b1e3f; --shadow:#0b1e3f;
  --cyan:#19d3ff; --magenta:#ff3d8b; --yellow:#ffc83d; --green:#2bd97c; --red:#ff4d5e;
  --good-bg:#e3fff0; --good-line:#0f8a4b; --bad-bg:#ffeef1; --bad-line:#c21436; --warn-bg:#fff6d4;
  --display:"Press Start 2P","Courier New",Courier,monospace;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#071631; --grid:rgba(120,170,255,.07); --panel:#10264b; --panel2:#0b1d3b;
    --ink:#eaf2ff; --muted:#a9bddf; --line:#7aa6ea; --shadow:#01060f;
    --good-bg:#0d3b29; --good-line:#3ee08e; --bad-bg:#3d1024; --bad-line:#ff6b85; --warn-bg:#3a3012;
  }
}
:root[data-theme="dark"]{
  --page:#071631; --grid:rgba(120,170,255,.07); --panel:#10264b; --panel2:#0b1d3b;
  --ink:#eaf2ff; --muted:#a9bddf; --line:#7aa6ea; --shadow:#01060f;
  --good-bg:#0d3b29; --good-line:#3ee08e; --bad-bg:#3d1024; --bad-line:#ff6b85; --warn-bg:#3a3012;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100%; color:var(--ink); background-color:var(--page);
  background-image:linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px);
  background-size:18px 18px; font-family:var(--body); font-size:16px; line-height:1.5;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px dashed var(--magenta);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:1260px;margin:0 auto;padding:16px 16px 28px}
[hidden]{display:none !important}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{background:none;border:0;padding:4px 0;font-family:var(--display);font-size:clamp(15px,2.2vw,22px);letter-spacing:.02em;color:var(--ink);text-shadow:3px 3px 0 var(--cyan)}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);font-weight:700;font-size:14px}
.chip b{font-family:var(--display);font-size:11px}
.chip.chip-ch{border-left:10px solid var(--chap)}
.chip.hp{color:var(--red);font-size:18px;letter-spacing:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 14px;border:3px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:3px 3px 0 var(--shadow);font-weight:700;text-align:center;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shadow)}
.btn.primary{background:var(--yellow);color:#231800;border-color:#0b1e3f}
.btn.go{background:var(--green);color:#03240f;border-color:#0b1e3f}
.btn.hot{background:var(--magenta);color:#fff;border-color:#0b1e3f}
.btn.small{min-height:36px;padding:5px 10px;font-size:14px}
.btn.big{min-height:54px;padding:12px 20px;font-size:17px}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* hub */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;padding:24px;background:var(--panel);border:4px solid var(--line);box-shadow:8px 8px 0 var(--shadow);margin-bottom:22px}
.title{margin:0;font-family:var(--display);font-size:clamp(26px,5.4vw,56px);line-height:1.05;letter-spacing:-.02em;text-shadow:4px 0 0 var(--cyan),-3px 3px 0 var(--magenta)}
.subtitle{margin:12px 0 0;font-family:var(--display);font-size:clamp(11px,1.5vw,14px);color:var(--muted)}
.pitch{max-width:60ch;margin:16px 0 0;font-size:17px}
.op{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;font-weight:700}
.op input{min-height:44px;width:14ch;padding:6px 10px;border:3px solid var(--line);background:var(--panel2);font-family:var(--display);font-size:12px;text-transform:uppercase}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.stat{padding:14px;border:3px solid var(--line);background:var(--panel2)}
.stat b{display:block;font-family:var(--display);font-size:clamp(15px,2vw,20px);margin-bottom:6px}
.stat span{color:var(--muted);font-size:14px}
.stat.wide{grid-column:1/-1;display:flex;gap:14px;align-items:center}
.stat.wide svg{width:56px;height:56px;flex:none;image-rendering:pixelated}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.chap{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:196px;padding:16px 16px 14px;text-align:left;background:var(--panel);border:3px solid var(--line);border-top:12px solid var(--chap);box-shadow:5px 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.chap:not(:disabled):hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--shadow)}
.chap:disabled{cursor:not-allowed;background:var(--panel2);opacity:.72}
.chap-no{font-family:var(--display);font-size:22px;color:var(--ink)}
.chap-name{font-family:var(--display);font-size:12px;line-height:1.5}
.chap-src{color:var(--muted);font-size:14px;line-height:1.35}
.chap-boss{font-size:14px}
.chap-foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700}
.stars{letter-spacing:3px;color:#d69a00;font-size:16px}
.stars .off{color:var(--muted);opacity:.5}
.mini-bar{width:100%;height:10px;border:2px solid var(--line);background:var(--panel2)}
.mini-bar i{display:block;height:100%;background:var(--chap)}
.badge{display:inline-block;padding:2px 7px;border:2px solid var(--line);font-size:12px;font-weight:700;background:var(--panel2)}
.settings{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:22px;padding:14px 16px;border:3px dashed var(--line);font-size:15px}
.settings label{display:flex;gap:10px;align-items:center}
.settings input[type=checkbox]{width:22px;height:22px;accent-color:var(--magenta)}

/* play */
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,380px);gap:18px;align-items:start}
.stage{position:relative;background:#050d1d;border:4px solid var(--line);box-shadow:8px 8px 0 var(--shadow);overflow:hidden}
.stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.under{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.keys{margin:0;color:var(--muted);font-size:14px;max-width:44ch}
.keys kbd{font-family:var(--display);font-size:9px;padding:2px 5px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.pad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;margin:4px auto 0;user-select:none;-webkit-user-select:none}
.pad button{border:3px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--shadow);font-family:var(--display);font-size:14px;touch-action:none}
.pad button:active{transform:translate(2px,2px);box-shadow:none}
.pad .use{background:var(--yellow);color:#231800}
@media (pointer:coarse), (max-width:900px){ .pad{display:grid} }
@media (pointer:coarse){ .keys{display:none} }
.console{background:var(--panel);border:4px solid var(--line);box-shadow:8px 8px 0 var(--shadow);min-height:420px;display:flex;flex-direction:column}
.console-head{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0b1e3f;color:#eaf2ff;font-family:var(--display);font-size:10px}
.led{width:10px;height:10px;background:var(--green);box-shadow:2px 2px 0 #0a7a44}
.console-body{padding:16px;overflow:auto;max-height:min(74vh,760px)}
@media (max-width:900px){ .play{grid-template-columns:1fr} .console-body{max-height:none} }

/* console content */
.kick{font-family:var(--display);font-size:10px;color:var(--muted);margin:0 0 8px}
.ptitle{font-family:var(--display);font-size:16px;line-height:1.4;margin:0 0 6px}
.src{margin:0 0 14px;color:var(--muted);font-size:15px}
.say{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;margin:0 0 14px}
.say svg{width:48px;height:48px;border:3px solid var(--line);image-rendering:pixelated;background:#0b1e3f}
.who{font-family:var(--display);font-size:10px;line-height:1.5}
.who span{display:block;font-family:var(--body);font-size:13px;color:var(--muted);margin-top:2px}
.say p{margin:4px 0 0}
.obj{border:3px solid var(--line);padding:12px;margin:0 0 14px;background:var(--panel2)}
.obj .r{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px}
.obj .r b{font-family:var(--display);font-size:11px}
.bar{height:12px;border:2px solid var(--line);background:var(--panel);margin:6px 0 12px}
.bar:last-child{margin-bottom:0}
.bar i{display:block;height:100%;background:var(--cyan)}
.bar.sync i{background:var(--green)}
.bar.boss i{background:var(--red)}
.how{margin:0 0 14px;padding-left:20px;font-size:15px}
.how li{margin-bottom:6px}
.note{padding:10px 12px;border:3px solid var(--line);background:var(--warn-bg);font-size:15px;margin:0 0 14px}
.good{background:var(--good-bg)}
.bad{background:var(--bad-bg)}
.lore{border:3px solid var(--line);background:#0b1e3f;color:#bff2ff;padding:12px;font-family:var(--display);font-size:10px;line-height:1.9;margin:0 0 14px}
.cardlist{margin:0 0 14px;padding:0;list-style:none;display:grid;gap:6px}
.cardlist li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border:2px solid var(--line);background:var(--panel2);font-size:15px}

/* questions */
.q-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--muted)}
.tag{display:inline-block;padding:2px 7px;border:2px solid currentColor;font-size:12px}
.q-p:focus{outline:none}
.q-p{font-size:18px;font-weight:700;line-height:1.4;margin:0 0 10px}
.q blockquote{margin:0 0 12px;padding:10px 12px;border-left:6px solid var(--cyan);background:var(--panel2);font-style:italic}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;width:100%;min-height:48px;padding:8px 10px;text-align:left;border:3px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--shadow);line-height:1.35}
.opt:not(:disabled):hover{background:var(--panel2)}
.opt .k{display:grid;place-items:center;width:28px;height:28px;border:2px solid var(--line);font-family:var(--display);font-size:10px}
.opt:disabled{cursor:default}
.opt.correct{background:var(--good-bg);border-color:var(--good-line)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad-line)}
.fb{margin-top:12px}
.fb:empty{display:none}
.verdict{font-family:var(--display);font-size:11px;margin:0 0 6px}
.verdict.ok{color:var(--good-line)}
.verdict.no{color:var(--bad-line)}
.reread{margin:10px 0 0;padding:12px;border:3px solid var(--line);border-left:10px solid var(--chap,var(--cyan));background:var(--panel2)}
.reread b{font-family:var(--display);font-size:11px;line-height:1.6}
.reread p{margin:6px 0 0;font-size:15px}
.progress-tag{display:inline-block;margin-top:8px;padding:3px 8px;border:2px solid var(--line);font-weight:700;font-size:13px}
.progress-tag.up{background:var(--good-bg)}
.progress-tag.down{background:var(--bad-bg)}
.boss-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.boss-top b{font-family:var(--display);font-size:11px}

/* modals */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px));background:rgba(3,9,22,.74)}
.sheet{width:100%;max-width:820px;max-height:100%;overflow:auto;padding:20px;background:var(--panel);border:4px solid var(--line);box-shadow:8px 8px 0 var(--shadow)}
.sheet h2{font-family:var(--display);font-size:15px;line-height:1.5;margin:0 0 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.sheet-card{max-width:640px;background:transparent;border:0;box-shadow:none;padding:6px}

/* the memory cartridge flashcard */
.cart{perspective:1400px;width:100%}
.cart-inner{display:grid;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.cart.flipped .cart-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;position:relative;min-height:340px;padding:22px 24px 46px;color:#0b1e3f;background:#f7fbff;border:4px solid #0b1e3f;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:polygon(28px 0,100% 0,100% 100%,0 100%,0 28px);box-shadow:inset 0 0 0 4px #fff}
.face::before{content:"";position:absolute;left:0;top:0;width:40px;height:40px;background:linear-gradient(135deg,#0b1e3f 0 50%,transparent 50%)}
.face::after{content:"";position:absolute;left:24px;right:24px;bottom:12px;height:16px;background:repeating-linear-gradient(90deg,#d9a520 0 12px,transparent 12px 18px);border-top:3px solid #0b1e3f}
.face-b{transform:rotateY(180deg);background:#0b1e3f;color:#eaf2ff;box-shadow:inset 0 0 0 4px #183468}
.face-b::before{background:linear-gradient(135deg,#f7fbff 0 50%,transparent 50%)}
.strip{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 18px 18px;padding:6px 10px;background:var(--chap);color:#07142b;font-weight:700;font-size:13px;border:3px solid #0b1e3f}
.strip span:last-child{font-family:var(--display);font-size:9px}
.face .cart-term{font-family:var(--display);font-size:clamp(18px,3.6vw,27px);line-height:1.45;margin:10px 0 16px;overflow-wrap:anywhere;color:#0b1e3f}
.face-f{display:flex;flex-direction:column}
.face-f .cart-term{margin-top:auto}
.face-f .pips{margin-top:auto}
.cart-cue{font-size:16px;color:#45597b;margin:0 0 18px;max-width:46ch}
.face-b .cart-term{font-size:13px;margin:0 0 10px;color:var(--chap)}
.cart-def{font-size:18px;font-weight:700;line-height:1.4;margin:0 0 12px}
.cart-body{font-size:15.5px;line-height:1.55;margin:0 0 14px;color:#d5e3fb}
.pips{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.pips i{width:22px;height:10px;border:2px solid currentColor;display:inline-block}
.pips i.on{background:currentColor}
.pips span{margin-left:4px}
.card-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.card-hint{text-align:center;margin:12px auto 0;max-width:52ch;color:#eaf2ff;font-size:15px}
.deck-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.deck-tabs button{min-width:44px;min-height:40px;border:3px solid var(--line);background:var(--panel);font-family:var(--display);font-size:10px;border-bottom:6px solid var(--chap)}
.deck-tabs button[aria-pressed="true"]{background:var(--chap);color:#07142b}
.deck-tabs button:disabled{opacity:.4;cursor:not-allowed}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:0 0 14px}
.mini{display:flex;flex-direction:column;gap:8px;min-height:120px;padding:12px;text-align:left;border:3px solid var(--line);border-top:8px solid var(--chap);background:var(--panel2);box-shadow:3px 3px 0 var(--shadow)}
.mini b{font-size:15px;line-height:1.3}
.mini .pips{margin-top:auto}
.mini.empty{border-style:dashed;box-shadow:none;color:var(--muted);cursor:default;justify-content:center;font-size:14px}
.logentry{padding:12px;border:3px solid var(--line);margin:0 0 10px;background:var(--panel2)}
.logentry b{display:block;font-family:var(--display);font-size:10px;line-height:1.6;margin-bottom:6px}
.logentry p{margin:0}
.scene{background:#0b1e3f;color:#eaf2ff;border:4px solid var(--line);padding:22px}
.scene h2{color:var(--yellow)}
.scene .term{font-family:var(--display);font-size:10px;line-height:2;color:#bff2ff;padding:12px;border:3px solid #2f63b3;background:#06122a;margin:14px 0 0}
.scene .alarm{color:#ff6b85}
.dots{display:flex;gap:6px;margin-top:16px}
.dots i{width:12px;height:12px;border:2px solid #eaf2ff}
.dots i.on{background:var(--yellow)}

.hook{margin:0 0 12px;padding:9px 11px;background:#ffc83d;color:#231800;border:3px solid #0b1e3f;font-size:15.5px;font-weight:700;line-height:1.4}
.hook span{display:block;font-family:var(--display);font-size:8px;font-weight:400;margin-bottom:5px;letter-spacing:.02em}
.pts{margin:0 0 12px;padding-left:20px;font-size:15px;line-height:1.5}
.pts li{margin-bottom:6px}
.pts li::marker{color:var(--chap,var(--cyan))}
.face-b .pts{color:#d5e3fb}
.face-b .pts b{color:#ffffff}
.work{margin:0 0 14px;padding:10px 12px 8px;border:2px dashed currentColor;font-size:14.5px;font-variant-numeric:tabular-nums}
.work .wt{display:block;font-family:var(--display);font-size:9px;line-height:1.6;margin-bottom:8px}
.work ol{margin:6px 0 0;padding-left:22px}
.work li{margin-bottom:3px}
.gantt{margin:4px 8px 6px}
.g-name{font-size:13px;font-weight:700;margin:0 0 4px}
.g-bar{display:flex;height:28px;border:2px solid #0b1e3f;background:#0b1e3f}
.g-bar span{display:grid;place-items:center;min-width:0;overflow:hidden;font-size:11px;font-weight:700;color:#07142b;border-right:2px solid #0b1e3f}
.g-bar span:last-child{border-right:0}
.g-ticks{position:relative;height:18px;font-size:11px}
.g-ticks i{position:absolute;top:2px;transform:translateX(-50%);font-style:normal}
.disk{margin:4px 0 8px}
.disk svg{display:block;width:100%;max-width:460px;height:auto}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.terms li{padding:3px 8px;border:2px solid var(--line);background:var(--panel2);font-size:13px;font-weight:700}
.reread .cart-def{font-size:16px;margin:6px 0 10px}
.reread .hook{margin-top:8px}
.hint-slot:empty{display:none}
.hint-slot{margin:0 0 12px}
.sum{padding:14px 16px 4px;margin:0 0 12px;border:3px solid var(--line);border-left:10px solid var(--chap);background:var(--panel2);break-inside:avoid}
.sum h3{font-family:var(--display);font-size:12px;line-height:1.5;margin:0 0 10px}
.sum .cart-def{font-size:16px}
.qtimer{height:10px;margin:0 0 12px;border:2px solid var(--line);background:var(--panel2)}
.qtimer i{display:block;height:100%;width:100%;background:var(--green)}
.qtimer.low i{background:var(--red)}
.print-only{display:none}
@media print{
  body{background:#fff !important;color:#000 !important}
  .shell,#live,.modal{display:none !important}
  .modal.printing{display:block !important;position:static;background:none;padding:0}
  .modal.printing .sheet{max-height:none;overflow:visible;border:0;box-shadow:none;padding:0;max-width:none;background:#fff;color:#000}
  .no-print{display:none !important}
  .print-only{display:block}
  .sum{background:#fff}
}

/* section badge */
.chap-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge.sec{background:var(--chap);color:#07142b;font-family:var(--display);font-size:8px;padding:4px 7px}

/* leaderboard */
.board-strip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20px;padding:18px 20px;margin:0 0 22px;background:var(--panel);border:4px solid var(--line);box-shadow:8px 8px 0 var(--shadow)}
.board-strip h2{font-family:var(--display);font-size:14px;line-height:1.5;margin:0 0 10px}
.myrank{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.myrank b{font-family:var(--display);font-size:clamp(26px,4.4vw,40px);line-height:1;text-shadow:3px 3px 0 var(--magenta)}
.myrank span{color:var(--muted);font-weight:700}
.chase{margin:0 0 12px;font-size:15px}
.podium{list-style:none;margin:0;padding:0;display:grid;gap:6px;align-content:start}
.podium li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border:2px solid var(--line);background:var(--panel2)}
.podium li.me{background:var(--warn-bg);border-width:3px}
.podium .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.podium .nm small{font-weight:400;color:var(--muted);margin-left:6px}
.podium .pt{font-family:var(--display);font-size:11px}
.podium .empty{grid-template-columns:1fr;color:var(--muted);border-style:dashed}
.rk{display:inline-grid;place-items:center;min-width:36px;height:28px;padding:0 4px;border:2px solid var(--line);font-family:var(--display);font-size:10px;background:var(--panel);color:var(--ink)}
.rk.r1{background:#ffc83d;color:#231800}
.rk.r2{background:#dbe6f5;color:#0b1e3f}
.rk.r3{background:#e39a5c;color:#2a1405}
.lb-status{margin:0 0 12px;padding:9px 11px;border:3px dashed var(--line);font-size:14.5px}
.lb-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.lb-tabs button{min-width:44px;min-height:40px;padding:0 10px;border:3px solid var(--line);background:var(--panel);font-family:var(--display);font-size:10px;border-bottom:6px solid var(--chap,var(--yellow))}
.lb-tabs button[aria-pressed="true"]{background:var(--chap,var(--yellow));color:#07142b}
.lb-wrap{overflow-x:auto;border:3px solid var(--line);background:var(--panel);margin:0 0 14px}
.lb{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.lb th{position:sticky;top:0;font-family:var(--display);font-size:9px;font-weight:400;text-align:left;padding:9px 10px;background:#0b1e3f;color:#eaf2ff;white-space:nowrap}
.lb td{padding:7px 10px;border-top:2px solid var(--line);white-space:nowrap}
.lb .num{text-align:right}
.lb tr.me td{background:var(--warn-bg);font-weight:700}
.lb .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.lb-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;font-size:14.5px}
.lb-foot label{display:flex;gap:10px;align-items:center}
.lb-foot input{width:22px;height:22px;accent-color:var(--magenta)}
.rules{margin:0 0 14px;border:3px solid var(--line);background:var(--panel2);padding:10px 12px}
.rules summary{cursor:pointer;font-weight:700}
.rules ul{margin:8px 0 0;padding-left:20px;font-size:14.5px}
.op-note{display:block;width:100%;font-weight:400;font-size:13.5px;color:var(--muted);margin-top:-4px}
.code-box{margin:14px 0 0;padding:12px;border:3px dashed var(--line);background:var(--panel2)}
.code-box .code{font-family:var(--display);font-size:11px;letter-spacing:.05em}
.code-in{min-height:40px;width:26ch;max-width:100%;padding:6px 10px;border:3px solid var(--line);background:var(--panel);font-family:var(--display);font-size:11px;text-transform:uppercase}
@media (max-width:760px){ .board-strip{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){
  .cart-inner,.btn,.chap{transition:none}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding:18px}
  .shell{padding:12px 12px 24px}
  .face{min-height:300px;padding:18px 18px 44px}
}

  boss:{ name:"The Bottleneck", role:"clog on the system bus", color:"#ff8a3d", look:{horns:true},

  cards:[

     q:["A music app wants to play sound through the speakers. Where does its request go first?","To the operating system, which drives the hardware for it","Straight to the speaker hardware","To the user, who approves it","To another application","The OS is the intermediary between applications and hardware."]},
    {id:"pillars", t:"The three pillars", d:"The course map: sharing the CPU and memory, running many things at once, and keeping data safe over time.",
     b:"Virtualization covers the CPU and memory. Concurrency covers threads, scheduling and deadlock. Persistence covers I/O devices, the hard disk, the file system, and data integrity and protection.",
     q:["Which pillar does the file system belong to?","Persistence","Virtualization","Concurrency","Arbitration","Persistence groups I/O devices, the HDD, the file system, and data integrity and protection."]},
    {id:"abstraction", t:"Abstraction", d:"Hiding the details of the hardware from applications, so they don't need to be tailored for every device.",
     b:"Lecture quiz examples: supporting both Intel and AMD processors, letting Zoom use different camera devices, and accessing two different hard disks.",
     q:["A game runs unchanged on laptops with completely different graphics chips. Which OS role makes that possible?","Abstraction","Arbitration","Persistence","Bootstrapping","The OS hides the device differences behind one interface, so the game needs no version per chip."]},
    {id:"arbitration", t:"Arbitration", d:"Managing access to shared resources, so multiple applications can share the same hardware simultaneously.",
     b:"Lecture quiz examples: switching between two applications, and separating the memory allocated to different applications. Sending and receiving messages over the network needs both abstraction and arbitration.",
     q:["Two apps want the printer at the same moment. Which OS role decides who gets it?","Arbitration","Abstraction","Virtualization","Compilation","Deciding who uses a shared resource, and when, is arbitration."]},
    {id:"cycle", t:"Instruction cycle", d:"Fetch the next instruction from memory, decode what it does, then execute it and store the result.",
     b:"Fetch: get the next instruction from memory and increase the program counter. Decode: the control unit (CU) works out what the instruction does. Execute: the ALU performs it (for example, adds two numbers) and the result is stored.",
     q:["During which step is the program counter increased?","Fetch","Decode","Execute","Store","Fetch reads the next instruction and advances the program counter."]},
    {id:"vonneumann", t:"Von Neumann architecture", d:"A design where programs and data live in the same memory, linked to the CPU and control unit by buses.",
     b:"Parts: memory (programs and data), a CPU with the ALU and registers, a control unit with the program counter and instruction register, plus input and output devices. The data bus carries values, the address bus carries memory locations, and the control bus carries control signals.",
     q:["Which bus tells memory which location the CPU wants to read?","The address bus","The data bus","The control bus","The instruction register","The location travels on the address bus. The value itself comes back on the data bus."]},
    {id:"bottleneck", t:"Von Neumann bottleneck", d:"The single shared path between CPU and memory limits speed, because instructions and data take turns crossing it.",
     b:"The CPU can work much faster than memory can deliver. Since instructions and data share one memory and one bus, the CPU often stalls, waiting. A cache between the CPU and main memory is one way systems soften this.",
     q:["A CPU is twice as fast as last year's, but a memory-heavy program barely speeds up. What is the likely culprit?","The von Neumann bottleneck","Too much abstraction","Arbitration overhead","The bootstrap program","The CPU is waiting on the shared path to memory, not computing."]}

{

  pal:{a:"#1b0f38", b:"#211242", w:"#43207f", t:"#6b3bc4"},

  relic:{title:"Privileged trace", text:"A privileged operation was started from inside the system, moments before the breach. Source: a process whose parent no longer exists."},

    {id:"kernel", t:"Kernel", d:"The only part of the OS that runs all the time, from the moment the PC starts until shutdown.",
     b:"Layers from the lecture: user, applications, utilities, the operating system, and at its core the kernel, right above the hardware. From the user view, the OS is about convenience, ease of use and performance. From the system view, it is a resource allocator and control program that optimizes for efficiency and fairness.",
     q:["You close every app and leave the PC idle. Which part of the OS is certainly still running?","The kernel","The utilities","The applications","The bootstrap program","The kernel runs from boot to shutdown. Everything else comes and goes."]},
    {id:"boot", t:"Bootstrap program", d:"Firmware stored in ROM or EPROM that runs at power-up, initializes the system and loads the kernel.",
     b:"At power-up or reboot the bootstrap program is loaded. It initializes all aspects of the system, then loads the operating system kernel and starts its execution. The kernel then starts system daemons, which are services provided outside the kernel.",
     q:["Where is the bootstrap program typically stored?","In ROM or EPROM, as firmware","In the kernel stack","On the heap of the first process","In the page table","It has to survive power-off, so it lives in firmware."]},
    {id:"interrupt", t:"Interrupts and traps", d:"Signals that hand control to a service routine: from a hardware device, or generated by software.",
     b:"A hardware interrupt comes from a device (for example, an I/O operation finished). A trap or exception is a software interrupt caused by an error (division by zero) or by a request for an OS service (a system call). The interrupt vector holds the addresses of all service routines, and the address of the interrupted instruction must be saved. The kernel is interrupt driven.",
     q:["A program divides by zero. What happens?","A trap (software interrupt) hands control to the OS","The disk raises a hardware interrupt","The bootstrap program restarts","The timer counts down to zero","Errors like division by zero raise a trap so the OS can take control."]},
    {id:"dualmode", t:"Dual-mode operation", d:"A hardware bit separates user code (1) from kernel code (0), and privileged instructions only run with the bit at 0.",
     b:"Restricted to the OS: I/O instructions, memory management instructions, setting the mode bit, enabling or disabling interrupts, and halting the machine (HLT). A user can't set the bit to kernel directly: a system call switches to kernel mode, and returning from the call resets it to user mode.",
     q:["A user program tries to run HLT to halt the machine. What should happen?","It is refused, because HLT is privileged","The PC halts immediately","It is allowed if the program is fast enough","The mode bit flips to 0 automatically","Halting the machine is a privileged instruction, only allowed in kernel mode."]},
    {id:"syscall", t:"System call", d:"An OS procedure an application calls to perform tasks on its behalf: the programming interface to OS services.",
     b:"Think of it as the OS API. Each system call has a number, and the system-call interface keeps a table indexed by those numbers. The caller only needs to obey the API. Common APIs: Win32 for Windows, POSIX for UNIX, Linux and macOS, and the Java API for the JVM.",
     q:["Your program calls write() to save a file. How does the request reach the kernel?","Through a system call, found by its number in the system-call table","By setting the mode bit to 0 itself","Through the bootstrap program","By writing directly to the disk controller","The system-call interface looks up the number and invokes the kernel routine."]},
    {id:"timer", t:"Timer", d:"A hardware counter that interrupts the CPU after a set period, so no process can loop forever or hog resources.",
     b:"The counter is decremented by the physical clock, and at zero it raises an interrupt. The OS sets it before scheduling a process, to regain control or end a program that exceeds its time. The lecture's hardware support table: protection uses user/kernel mode and base/limit registers, interrupts use interrupt vectors, system calls use traps, scheduling and error recovery use the timer, synchronization uses atomic instructions.",
     q:["A student's program has an infinite loop, yet the OS still regains control. What made that possible?","The timer interrupt","The bootstrap program","A hard link","The data bus","When the timer's counter hits zero, the interrupt hands control back to the OS."]},
    {id:"structure", t:"OS structures", d:"Ways to organize an OS: monolithic, layered, microkernel, loadable modules, and hybrids that mix them.",
     b:"Monolithic (original UNIX, MS-DOS): everything below the system-call interface in one big kernel. Layered: layer 0 is the hardware, layer N the user interface, and each layer only uses lower ones. Microkernel (Mach): move as much as possible into user space and communicate by message passing; easier to extend and port, more reliable and secure, but slower. Modules: loadable kernel modules (Linux, Solaris). Hybrid: most modern OSes, like Linux (monolithic plus modular) and Windows.",
     q:["Which structure is more reliable because less code runs in kernel mode, but pays a message-passing performance cost?","Microkernel","Monolithic","Layered","Simple structure (MS-DOS)","Microkernels push services into user space and talk through messages."]}
  ],
  bossQ:[
    ["dualmode","The Warden sets your mode bit to 1. Which of these can you now NOT do?","Disable interrupts","Add two registers (ADD ax, bx)","Move a value into a register","Make a system call","Enabling or disabling interrupts is privileged. Mode bit 1 means user mode."],

    ["interrupt","The disk finishes a transfer. How does its controller tell the CPU?","It raises a hardware interrupt","It makes a system call","It sets the mode bit","It waits for the timer","Device controllers signal completion by causing an interrupt."],
    ["timer","From the lecture's hardware support table: which hardware feature backs scheduling and error recovery?","The timer","Atomic instructions","The trap instruction","Memory mapping","Scheduling and error recovery rely on the timer."],

{
  id:3, district:"Process District", lec:"Lecture 3", topic:"Processes, states, PCB and IPC", color:"#2bd97c",
  pal:{a:"#0b2828", b:"#0e3030", w:"#145b55", t:"#1f8a80"},
  boss:{ name:"The Zombie King", role:"ruler of unreaped processes", color:"#9be36b", look:{crown:true, ghost:false},

  cards:[

     b:"The program is an executable (EXE) on disk. When you start it with a mouse click or the command line, it becomes a process. One program can be several processes. Within a single process, execution progresses sequentially.",

    {id:"layout", t:"Process memory layout", d:"Text for code, data for globals, heap for run-time allocation, stack for function calls, plus the PC and registers.",
     b:"Text section: the program code. Data section: global variables. Heap: memory allocated dynamically during run time. Stack: temporary data such as function parameters, return addresses and local variables. The program counter and registers hold the current activity.",
     q:["A C program calls malloc() to create a buffer at run time. Where does that memory come from?","The heap","The stack","The text section","The data section","Dynamically allocated memory lives on the heap."]},
    {id:"states", t:"Five process states", d:"The life stages a process moves through, from being created to finishing.",

     q:["A process has everything it needs, but another process is using the only CPU. Which state is it in?","Ready","Waiting","New","Running","Ready means runnable, just not assigned a processor yet."]},
    {id:"transitions", t:"State transitions", d:"The arrows of the state diagram: admitted, dispatch, interrupt, I/O or event wait, I/O or event completion, exit.",
     b:"New to ready: admitted. Ready to running: scheduler dispatch. Running to ready: interrupt. Running to waiting: I/O or event wait. Waiting to ready: I/O or event completion. Running to terminated: exit. Waiting never jumps straight to running.",
     q:["A process's disk read just completed, but the CPU is busy. Where does it go?","From waiting to ready","From waiting to running","From running to terminated","From ready to new","When the event completes, the process becomes ready and waits for the scheduler."]},
    {id:"pcb", t:"Process Control Block", d:"The record the OS keeps for each process: state, program counter, registers, scheduling, memory, accounting and I/O info.",
     b:"Also called the task control block. Process state; program counter (next instruction to execute); CPU registers; CPU scheduling info (priorities, queue pointers); memory-management info; accounting info (CPU used, clock time elapsed, time limits); I/O status (devices allocated, list of open files).",
     q:["Where would the OS find how much CPU time a process has used so far?","In the accounting information of its PCB","In its text section","On its heap","In the interrupt vector","CPU used and elapsed time are accounting info in the PCB."]},
    {id:"context", t:"Context switch", d:"Saving the state of the old process and loading the saved state of the new one when the CPU changes processes.",
     b:"The context of a process is represented in its PCB. Switch time is pure overhead: the system does no useful work while switching. The more complex the OS and the PCB, the longer the switch. Some hardware provides multiple register sets per CPU, so several contexts are loaded at once.",
     q:["Why do OS designers try to keep context switches short?","The switch is pure overhead: no useful work happens during it","It erases the old process","It is when all I/O happens","It increases the program counter","Every switch costs time with nothing productive happening."]},
    {id:"fork", t:"fork, exec, wait, exit", d:"The UNIX calls that create a child, load a new program into it, pause until it finishes, and end a process.",
     b:"fork() creates a new process; the child is a duplicate of the parent. exec() after fork() replaces the process's memory space with a new program. The parent calls wait() for the child to end; pid = wait(&status) returns its status and PID. exit() asks the OS to delete the process. A zombie has terminated but its parent hasn't called wait() yet. An orphan's parent terminated without waiting for it.",
     q:["A shell wants to run ls in a new process. Which pair of calls does it use, in order?","fork() then exec()","exec() then fork()","wait() then exit()","exit() then fork()","fork() makes the child; exec() loads the new program into it."]},
    {id:"ipc", t:"Interprocess communication", d:"How cooperating processes exchange data: through a region of memory they share, or by sending messages.",
     b:"Processes are independent or cooperating. Reasons to cooperate: information sharing, computation speedup, modularity, convenience. Shared memory: a shared region controlled by the user processes, who must synchronize their access. Message passing: send(message) and receive(message) over a link, no shared variables. Links can be physical (shared memory, hardware bus, network) or logical (direct or indirect, synchronous or asynchronous, automatic or explicit buffering).",
     q:["Two processes must communicate without any shared variables. Which IPC model fits?","Message passing","Shared memory","Context switching","Dual-mode operation","Message passing uses send() and receive() over a communication link."]}
  ],
  bossQ:[
    ["fork","A child exits, but its parent never calls wait(). What is the child now?","A zombie","An orphan","A daemon","A thread","It has terminated, but nobody collected its exit status."],
    ["fork","The King's own parent terminates while he's still running. What does that make him?","An orphan","A zombie","A kernel thread","A daemon","A process whose parent ended without waiting for it is an orphan."],
    ["transitions","P7 is running and asks for keyboard input. Which transition happens?","Running to waiting","Running to ready","Ready to waiting","Running to terminated","An I/O or event wait moves a running process to waiting."],
    ["transitions","A timer interrupt stops P7 before it finishes. Where does P7 go?","Running to ready","Running to waiting","Running to new","Ready to terminated","An interrupt sends it back to ready. It isn't waiting for any event."],
    ["pcb","Before switching P0 out, where does the OS save P0's registers and program counter?","In P0's PCB","On P1's stack","In the boot sector","In the text section","The PCB represents the process context."],
    ["layout","The King smashes a function's return address. Which section holds return addresses and local variables?","The stack","The heap","The data section","The text section","Function parameters, return addresses and locals live on the stack."],
    ["ipc","Two processes share a memory region. What is the main issue they must handle?","Synchronizing their access to the shared region","Choosing a message format","Asking the kernel before every read","Converting the region into a file","Shared memory is controlled by the processes, so they must synchronize."]
  ]
},
{
  id:4, district:"Thread Factory", lec:"Lecture 4", topic:"Threads, multicore programming and threading models", color:"#ffb347",
  pal:{a:"#261708", b:"#2d1c0b", w:"#6b3f12", t:"#a0621d"},
  boss:{ name:"The Tangle", role:"many threads, one kernel thread", color:"#ff5a5a", look:{heads:3},
    intro:"Many threads. One kernel thread. We move as one. We block as one.",
    hurt:["A thread came loose!","Stop mapping us one to one!","We are becoming... parallel?"],
    miss:["One of us blocked. So all of us wait. Including you.","Wrong. Tangled again.","That answer ran on one core. Slowly."] },
  intro:["The Thread Factory. Threads share their process's code, data and files, but each keeps its own stack, registers and PC.",
         "NULL split itself into dozens of threads and mapped them all onto a single kernel thread. The result is the Tangle. When one thread blocks, everything freezes."],
  mid:"NULL isn't a single stream of execution anymore. It's multithreaded. It's learning fast.",
  gate:"All cards synced. The Tangle is waiting, as one. Untangle it.",
  outro:["One-to-one mapping restored. Threads run on separate cores again.",
         "The threads we freed are all heading for the same shared counter. That's going to be a problem."],
  relic:{title:"Thread census", text:"Threads under the NULL signature: 64. Kernel threads backing them: 1. Blocked together: always."},
  cards:[
    {id:"thread", t:"Thread", d:"A single sequential execution stream inside a process, with its own PC, registers and stack.",
     b:"A thread does not exist without a process. Threads in one process share its code, data and files (its address space), and no system calls are needed for them to cooperate. The lecture's example: one PowerPoint process, with separate threads taking keyboard input, spell-checking the typo, and updating the display.",
     q:["Which of these does each thread get its own copy of?","Its stack","The code section","The open files","The global data","Threads share code, data and files, but each has its own registers, stack and PC."]},
    {id:"benefits", t:"Benefits of threads", d:"An app stays responsive when part of it blocks, shares resources easily, costs less than new processes, and can use many cores.",
     b:"Responsiveness: execution may continue if part of the process is blocked, especially important for user interfaces. Resource sharing: threads share the process's resources, easier than shared memory or message passing. Economy: cheaper than process creation, and thread switching has lower overhead than context switching. Scalability: a process can take advantage of multicore architectures.",
     q:["A video editor keeps its interface smooth while a long export runs. Which benefit is this?","Responsiveness","Economy","Scalability","Data splitting","The interface thread keeps running while another thread is busy."]},
    {id:"challenges", t:"Multicore programming challenges", d:"The hard parts of writing code for many cores: splitting work and data evenly and safely, then finding the bugs.",
     b:"Dividing activities: how to divide the application's execution. Balance: make the pieces similar in size. Data splitting: split the data to go with the tasks. Data dependency: make sure the split data doesn't depend on each other. Testing and debugging: much harder with more than one thread executing at a time.",
     q:["One core finishes its share in 1 second while another takes 20 seconds. Which challenge was ignored?","Balance","Data dependency","Economy","Responsiveness","The work was divided unevenly."]},
    {id:"concpar", t:"Concurrency vs parallelism", d:"Making progress on several tasks by interleaving them on one core, versus truly running them at the same time on many cores.",
     b:"Concurrency on a single core: T1, T2, T3, T4 take turns over time. Parallelism on a multicore system: core 1 runs T1 and T3 while core 2 runs T2 and T4, at the same moment. You can have concurrency without parallelism, but parallelism needs more than one core.",
     q:["A single-core laptop plays music while you type. What is that?","Concurrency only","Parallelism only","Both concurrency and parallelism","Neither","One core interleaves the tasks; nothing runs at the exact same instant."]},
    {id:"partypes", t:"Data vs task parallelism", d:"Running the same operation on different slices of the data across cores, versus spreading different operations across cores.",
     b:"Data parallelism distributes subsets of the same data across multiple cores, with the same operation on each. Task parallelism distributes threads across cores, each thread performing a unique operation.",
     q:["Four cores each blur one quarter of the same photo. Which type of parallelism is this?","Data parallelism","Task parallelism","Concurrency without parallelism","Many-to-one threading","Same operation, different slices of the data."]},
    {id:"amdahl", t:"Amdahl's law", d:"Speedup is at most 1 / (S + (1 - S) / N), where S is the serial portion and N is the number of cores.",
     b:"It identifies the gain from adding cores to an application with serial and parallel parts. Lecture example: 75% parallel and 25% serial, going from 1 to 2 cores gives 1 / (0.25 + 0.75 / 2) = 1.6 times. The serial part caps the speedup, however many cores you add.",
     q:["An app is 50% serial. What is the best speedup it could ever reach, even with unlimited cores?","2 times","4 times","Unlimited","1.6 times","As N grows, the speedup approaches 1 / S = 1 / 0.5 = 2."]},
    {id:"userkernel", t:"User threads vs kernel threads", d:"Threads managed by a library in user space, versus threads supported and managed by the OS itself.",
     b:"User thread libraries: POSIX Pthreads, Windows threads, Java threads. Kernel threads exist in almost every general-purpose OS. A thread library is either entirely in user space or a kernel-level library supported by the OS. In the Pthreads example, pthread_create() starts a thread running runner(), and pthread_join() waits for it to exit.",
     q:["In the Pthreads example, which call makes main() wait until the runner thread finishes the sum?","pthread_join()","pthread_create()","pthread_attr_init()","pthread_exit()","join blocks the caller until that thread exits."]},
    {id:"models", t:"Multithreading models", d:"How user threads map onto kernel threads: many-to-one, one-to-one, many-to-many, and the two-level mix.",
     b:"Many-to-one: one blocking thread blocks them all, and they can't run in parallel on multicore (Solaris Green Threads, GNU Portable Threads). One-to-one: each user thread gets its own kernel thread; more concurrency, but thread counts may be limited by overhead (Windows, Linux). Many-to-many: many user threads on a sufficient number of kernel threads. Two-level: many-to-many that can also bind a user thread to one kernel thread. Linux calls them tasks and creates them with clone(), whose flags choose what is shared.",
     q:["In a many-to-one model, one thread makes a blocking disk read. What happens to the others?","They all block","They keep running on other cores","They move to their own kernel threads","Nothing, the kernel skips the block","There is only one kernel thread, so one block stops all of them."]}
  ],
  bossQ:[
    ["models","The Tangle maps every thread onto one kernel thread. Why can't it use four cores?","Only one thread can be in the kernel at a time in many-to-one","Threads share their code","Its stacks are too small","Amdahl's law forbids it","Many-to-one threads can't run in parallel on multicore."],
    ["amdahl","The Tangle is 75% parallel and 25% serial. Going from 1 to 2 cores, what speedup do you get?","1.6 times","2 times","1.25 times","4 times","1 / (0.25 + 0.75 / 2) = 1 / 0.625 = 1.6."],
    ["thread","Two threads of the same process update one global variable. Why do they see each other's changes?","Threads share their process's data section","Each thread has its own copy of globals","They use message passing automatically","The kernel copies it between their stacks","Code, data and files are shared by all threads in the process."],
    ["concpar","Four threads on 2 cores: T1 and T3 alternate on core 1, T2 and T4 on core 2. This shows...","Both concurrency and parallelism","Only concurrency","Only parallelism","Neither","Tasks interleave on each core and the two cores run at once."],
    ["models","Which systems does the lecture give as one-to-one examples?","Windows and Linux","Solaris Green Threads","GNU Portable Threads","Only Windows with the threadfiber package","Windows and Linux map each user thread to a kernel thread."],
    ["benefits","A browser uses a thread instead of a whole new process for each tab, saving time and memory. Which benefit is that?","Economy","Responsiveness","Scalability","Balance","Threads are cheaper to create and switch than processes."]
  ]
},
{
  id:5, district:"Sync Vault", lec:"Lecture 5", topic:"Concurrency, synchronization and communication", color:"#ff3d8b",
  pal:{a:"#280b1b", b:"#300f21", w:"#6e1a45", t:"#a8296a"},
  boss:{ name:"Race Condition", role:"twins who never take turns", color:"#ff7ab8", look:{twin:true},
    intro:"PRO: I read counter, it's 5. CON: I read it too, it's 5. BOTH: And whoever stores last wins!",
    hurt:["PRO: Hey, a critical section!","CON: Who put a lock on this?","BOTH: Mutual exclusion? Unfair!"],
    miss:["PRO: Wrong! CON: Wrong! BOTH: We agree, for once.","That interleaving just broke your counter.","Inconsistent. Just how we like it."] },
  intro:["The Sync Vault guards shared data. Concurrent access to it can turn clean values into nonsense.",
         "The counter in here reads 4 and 6 at the same time. Somebody is racing."],
  mid:"Found the culprits: a producer and a consumer, both changing counter with no critical section around it.",
  gate:"All synced. The twins are inside. Make them take turns.",
  outro:["Critical sections restored. One process at a time, as it should be.",
         "With the Vault locked down, NULL moved on to the Scheduler Arena. It wants CPU time."],
  relic:{title:"Counter audit", text:"counter = 5. counter = 6. counter = 4. counter = 5. Every value was correct at some moment, and none of them were correct at the end."},
  cards:[
    {id:"prodcons", t:"Producer-consumer problem", d:"One process puts items into a fixed-size buffer while another takes them out, both sharing a counter.",
     b:"A bounded buffer of BUFFER_SIZE = N, with in and out pointers. The producer waits while counter == BUFFER_SIZE (buffer full); the consumer waits while counter == 0 (nothing to consume). Producer: buffer[in] = item; in = (in + 1) % BUFFER_SIZE; counter++. Consumer: item = buffer[out]; out = (out + 1) % BUFFER_SIZE; counter--.",
     q:["counter equals BUFFER_SIZE. What must the producer do?","Wait, because the buffer is full","Overwrite buffer[out]","Reset counter to 0","Tell the consumer to stop","A full buffer means the producer busy-waits."]},
    {id:"race", t:"Race condition", d:"When the outcome depends on the timing of concurrent access to shared data, leaving the data inconsistent.",
     b:"counter++ is really three CPU steps: register1 = counter; register1 = register1 + 1; counter = register1. The CPU can be taken before all three finish. Lecture example with counter = 5: if the producer's and consumer's steps interleave, counter ends at 4 or 6 instead of 5.",
     q:["Why can counter++ go wrong when two processes share counter?","It is three machine steps that can be interrupted midway","The ALU can't add","The buffer is always full","Integers can't be shared","A process can be interrupted between loading, incrementing and storing."]},
    {id:"cs", t:"Critical section", d:"The segment of code where a process changes shared variables, which no other process may execute at the same time.",
     b:"Structure of process Pi: the entry section (ask permission), the critical section, the exit section, then the remainder section. When one process is in its critical section, no other process may be in theirs.",
     q:["Where does a process ask permission to enter its critical section?","In the entry section","In the exit section","In the remainder section","On the heap","Permission is requested in the entry section."]},
    {id:"req", t:"The three requirements", d:"What any critical-section solution must guarantee: exclusive entry, no pointless postponing, and a limit on waiting.",
     b:"Mutual exclusion: if Pi is in its critical section, no other process is in theirs. Progress: if no one is inside and some processes want in, the choice of who enters next can't be postponed indefinitely. Bounded waiting: there is a limit on how many times others may enter after a process asks and before it is granted. Assume each process runs at nonzero speed, with nothing assumed about relative speeds.",
     q:["A process requested entry, but others keep entering ahead of it forever. Which requirement fails?","Bounded waiting","Mutual exclusion","Progress","Atomicity","There must be a limit on how often others go first."]},
    {id:"peterson", t:"Peterson's solution", d:"A two-process software solution using a shared turn variable and a two-slot flag array to take turns safely.",
     b:"Assumes load and store instructions are atomic. Shared: int turn; boolean flag[2]. Process i: flag[i] = true; turn = j; while (flag[j] && turn == j) do nothing; critical section; flag[i] = false; remainder. flag[i] = true means Pi is ready. It satisfies all three requirements. The simpler turn-only version forces strict alternation.",
     q:["In Peterson's solution, what does Pi do right after setting flag[i] = true?","Sets turn = j, giving the other process the turn","Enters its critical section immediately","Sets flag[j] = false","Sets turn = i","Pi says it's ready, then politely gives the turn away."]},
    {id:"mutex", t:"Mutex lock", d:"A boolean lock: call acquire() before the critical section and release() after it, both atomic.",
     b:"Mutex stands for mutual exclusion. acquire() loops while the lock isn't available, then sets available = false; release() sets available = true. It's usually built from hardware atomic instructions such as compare-and-swap. It requires busy waiting, so it is also called a spinlock.",
     q:["Why is a mutex lock also called a spinlock?","acquire() busy-waits in a loop until the lock is free","It rotates between processes","It spins the disk","It uses round robin","The waiting process keeps spinning in its while loop."]},
    {id:"semaphore", t:"Semaphore", d:"An integer S that can only be touched through atomic wait() and signal(), for more flexible synchronization than a lock.",
     b:"wait(S): while (S <= 0) busy wait; then S--. signal(S): S++. Only one process can modify the semaphore at a time. A counting semaphore ranges over an unrestricted domain and is usually set to the number of resource instances. A binary semaphore only ranges from 0 to 1, the same as a mutex lock.",
     q:["A lab has 3 identical printers. How should the printer semaphore start?","S = 3, a counting semaphore","S = 1, a binary semaphore","S = 0","S = -3","Counting semaphores start at the number of instances."]},
    {id:"deadlock", t:"Deadlock vs starvation", d:"Processes waiting forever for each other, versus one process that never gets the resource it needs.",
     b:"Deadlock: two or more processes wait indefinitely for each other to release a resource. The lecture's example: Sandy has the board and wants the marker; Kevin has the marker and wants the board. Starvation: a process is deprived of resources and may never get a semaphore or leave its queue. It generally shows up in priority scheduling.",
     q:["Sandy holds the board and waits for the marker. Kevin holds the marker and waits for the board. What is this?","Deadlock","Starvation","A race condition","Bounded waiting","Each waits forever for what the other holds."]}
  ],
  bossQ:[
    ["race","counter = 5. PRO loads it and adds 1. CON loads it and subtracts 1. PRO stores, then CON stores last. Final counter?","4","5","6","3","CON's register held 4, and its store came last."],
    ["race","Same start, but this time CON stores first and PRO stores last. Final counter?","6","5","4","7","PRO's register held 6, and its store came last."],
    ["req","A broken lock lets both twins into the critical section at once. Which requirement fails?","Mutual exclusion","Progress","Bounded waiting","Economy","Two processes inside at the same time breaks mutual exclusion."],
    ["semaphore","S = 0. A process calls wait(S). What happens?","It busy-waits until another process signals S","S becomes -1 and it enters","It enters the critical section right away","It terminates","wait() spins while S <= 0."],
    ["mutex","What usually implements acquire() and release() in hardware?","Atomic instructions such as compare-and-swap","The timer interrupt","The page table","The address bus","Atomic instructions make the lock operations indivisible."],
    ["deadlock","A low-priority process never runs because high-priority work keeps arriving. Deadlock or starvation?","Starvation","Deadlock","A race condition","Mutual exclusion","Nobody is waiting on anybody in a cycle. It's just never chosen."]
  ]
},
{
  id:6, district:"Scheduler Arena", lec:"Lecture 6, part 1", topic:"CPU scheduling, metrics, FCFS, SJF, SRT and round robin", color:"#4fc3ff",
  pal:{a:"#0a2233", b:"#0c283c", w:"#11507a", t:"#1a7ab8"},
  boss:{ name:"The Convoy", role:"one enormous CPU burst", color:"#ffa94d", look:{horns:true},
    intro:"Twenty-four units of burst time. Nobody passes. First come, first served.",
    hurt:["Someone shorter went first? Outrageous.","A time quantum? I was using that!","The queue behind me is... moving."],
    miss:["Wrong. Get back in line behind me.","Your waiting time just went up.","I'm still on the CPU. Try again next quantum."] },
  intro:["Scheduler Arena. The short-term scheduler picks who runs next, and the dispatcher hands over the CPU.",
         "NULL parked a giant CPU-bound process at the front of an FCFS queue. Everything behind it is stuck. That's the Convoy."],
  mid:"The ready queue is backed up to the district edge. Every one of those processes is I/O-bound, with tiny bursts, stuck behind one monster.",
  gate:"Synced. The Convoy is still on the CPU. Time to preempt it.",
  outro:["The ready queue is moving. Short jobs first, fair slices for the rest.",
         "In the confusion, NULL climbed into the priority queues above us. It wants to be first in line forever."],
  relic:{title:"Gantt fragment", text:"P1 from 0 to 24. P2 from 24 to 27. P3 from 27 to 30. Average waiting time: 17. Someone should have gone shortest first."},
  cards:[
    {id:"schedulers", t:"Three schedulers", d:"One picks the next ready process for the CPU, one swaps processes out to disk and back, one admits jobs into the ready queue.",
     b:"Short-term (CPU scheduler): selects which ready process should run next and allocates the CPU. Medium-term: swapping, removes processes from memory, stores them on disk, and brings them back to continue. Long-term (job scheduler): selects which processes are brought into the ready queue.",
     q:["Memory is overloaded, so a process is moved out to disk to continue later. Which scheduler did that?","The medium-term scheduler","The short-term scheduler","The long-term scheduler","The dispatcher","Swapping is the medium-term scheduler's job."]},
    {id:"preempt", t:"Preemptive vs non-preemptive", d:"Whether the OS can take the CPU away from a running process, or must wait until it finishes or blocks.",
     b:"Non-preemptive: once a process has the CPU, it keeps it until it terminates or switches to the waiting state (for I/O). Preemptive: a process can be removed from the CPU, going from running to ready, or from waiting to ready. Preemption can lead to race conditions.",
     q:["Under non-preemptive scheduling, when can the running process lose the CPU?","Only when it terminates or waits for I/O","Whenever a higher-priority process arrives","At the end of every time quantum","Whenever the timer ticks","Non-preemptive means the process gives up the CPU itself."]},
    {id:"dispatcher", t:"Dispatcher", d:"Gives the CPU to the process the short-term scheduler chose: switches context, switches to user mode, and jumps to the right spot in the program.",
     b:"Its work involves context switching, switching to user mode, and jumping to the right location in memory to resume the program. Dispatcher latency is the time it takes the dispatcher to stop one process and start another running.",
     q:["What is dispatch latency?","The time to stop one process and start another running","The time a process waits in the ready queue","The time from admission to exit","The time for a disk seek","It measures the dispatcher's own switching cost."]},
    {id:"bursts", t:"CPU-bound vs I/O-bound", d:"Processes that mostly compute with a few long CPU bursts, versus ones that mostly do I/O with many short bursts.",
     b:"Burst time is how long a process uses the CPU before it waits or finishes. An I/O-bound process spends more time doing I/O than computation, with many short CPU bursts. A CPU-bound process spends more time computing, with few very long CPU bursts.",
     q:["A text editor spends most of its time waiting for keystrokes. What kind of process is it?","I/O-bound","CPU-bound","Real-time","A zombie","It uses the CPU in short bursts between inputs."]},
    {id:"metrics", t:"Scheduling metrics", d:"The measures used to judge a scheduler: how busy the CPU is, how much finishes, and how long processes spend in the system.",
     b:"CPU utilization: work time / total time, keep the CPU busy. Throughput: processes completed per time unit (10 in 100 ms beats 5 in 100 ms). Turnaround time: exit minus arrival, from admission to exit. Waiting time: the sum of time spent in the ready queue. Response time: from admission to the first response.",
     q:["A process arrives at time 2 and exits at time 15. What is its turnaround time?","13","15","17","2","Turnaround = exit - arrival = 15 - 2."]},
    {id:"fcfs", t:"FCFS and the convoy effect", d:"Running processes strictly in arrival order, so short jobs can get stuck behind one long job.",
     b:"First come first serve, or FIFO. Lecture example, all arriving at 0: P1 = 24, P2 = 3, P3 = 3. Waiting times 0, 24 and 27, average 17; average turnaround 27. The convoy effect: short processes waiting behind a long process, like many I/O-bound processes behind one CPU-bound process.",
     q:["FCFS with P1 = 24, P2 = 3, P3 = 3, all arriving at time 0. Average waiting time?","17","3","27","5.67","(0 + 24 + 27) / 3 = 17."]},
    {id:"sjf", t:"SJF and SRT", d:"Always run the shortest job next; the preemptive version switches whenever a new arrival has less time remaining.",
     b:"SJF is optimal: it gives the minimum average waiting time for a set of processes. The FCFS jobs in SJF order (3, 3, 24) give an average waiting time of 3. The catch: the next burst length isn't known, so it is estimated with an exponential average (next guess = a x last actual burst + (1 - a) x last guess). SRT, shortest remaining time, is preemptive SJF; the lecture's example averages 6.5.",
     q:["Why is SJF hard to implement exactly?","The length of the next CPU burst isn't known in advance","It needs a time quantum","It always starves I/O-bound processes","It can't sort processes","The scheduler has to estimate burst lengths."]},
    {id:"rr", t:"Round robin", d:"Each process gets a small time quantum q; when it runs out, the process is preempted to the back of the ready queue.",
     b:"With n processes and quantum q, each gets 1/n of the CPU in chunks of at most q, and no process waits more than (n - 1)q. A timer interrupts every quantum. A huge q behaves like FCFS. q must be large compared with a context switch (q is usually 10 to 100 ms, a switch under 10 microseconds), and about 80% of CPU bursts should be shorter than q. Lecture example with q = 4: average waiting 5.67, turnaround 15.67, response 3.67.",
     q:["What happens to round robin if q is made enormous?","It behaves like FCFS","It becomes SJF","Context switches take over","It becomes priority scheduling","If no process ever uses up its quantum, it's just arrival order."]}
  ],
  bossQ:[
    ["fcfs","The Convoy (burst 24) is first in line; P2 and P3 (3 each) also arrive at time 0. Under FCFS, how long does P3 wait?","27","24","3","0","P3 waits for the Convoy (24) and P2 (3)."],
    ["sjf","Same three processes, scheduled SJF. Average waiting time?","3","17","13","6","Order 3, 3, 24: waits of 0, 3 and 6, so 9 / 3 = 3."],
    ["rr","Round robin with q = 4 and 5 processes. At most, how long can a process wait before its next turn?","16 time units","20 time units","4 time units","5 time units","(n - 1)q = 4 x 4 = 16."],
    ["metrics","Which metric counts only the time spent sitting in the ready queue?","Waiting time","Turnaround time","Response time","Throughput","Waiting time is the sum of time in the ready queue."],
    ["preempt","A new process with a shorter remaining time arrives and takes the CPU immediately. What kind of scheduling is this?","Preemptive, as in SRT","Non-preemptive SJF","FCFS","Non-preemptive priority","Taking the CPU away from the running process is preemption."],
    ["bursts","Why does the convoy effect hurt I/O-bound processes the most?","Their short bursts sit waiting behind one long CPU-bound burst","Their bursts are the longest","They can't use the CPU at all","They are always preempted","They need the CPU briefly but can't get it."]
  ]
},
{
  id:7, district:"Queue Citadel", lec:"Lecture 6, part 2", topic:"Priority, multilevel queues, multiprocessor and real-time scheduling", color:"#ffe14d",
  pal:{a:"#212108", b:"#27270b", w:"#5c5c14", t:"#8f8f22"},
  boss:{ name:"The Starver", role:"tyrant of fixed priority", color:"#c77dff", look:{crown:true, horns:true},
    intro:"Priority is everything. The low ones will wait. Forever, ideally.",
    hurt:["Aging? You're making them older AND more important?","A process from the background queue just ran!","Stop balancing my load!"],
    miss:["Wrong. Back of the lowest queue.","Your priority just dropped to 127.","The high ones go first. You are not a high one."] },
  intro:["The Queue Citadel: priority queues, feedback queues, and every processor in ATLAS-9.",
         "Its ruler, the Starver, runs strict fixed priority. Some low-priority processes here haven't touched a CPU in ages."],
  mid:"NULL set its own priority to the highest possible number... no wait, the lowest number. Lower number, higher priority. Of course it did.",
  gate:"All synced. The Starver's throne is open. Bring aging.",
  outro:["Aging is back on. Waiting processes climb until they finally get their turn.",
         "The CPUs are balanced again. NULL has gone after the one resource it still lacks: memory."],
  relic:{title:"Queue census", text:"Q0: RR, 8 ms. Q1: RR, 16 ms. Q2: FCFS. One process in Q2 has been waiting since boot. Its name has been redacted."},
  cards:[
    {id:"priority", t:"Priority scheduling", d:"Each process gets a priority number and the CPU goes to the most important one first; here, a lower number means higher priority.",
     b:"Non-preemptive lecture example, all arriving at 0: P2 (1), then P5 (2), P1 (3), P3 (4), P4 (5), average waiting 8.2. Preemptive priority takes the CPU as soon as a higher-priority process arrives (the lecture's example averages 1.8). The danger is starvation of low-priority processes.",
     q:["Lower number = higher priority. Which runs first: P1 (priority 3), P2 (priority 1) or P5 (priority 2)?","P2","P1","P5","Whichever arrived first","Priority 1 is the highest here."]},
    {id:"mlq", t:"Multilevel queue", d:"The ready queue split into several queues, each with its own algorithm, where each process is assigned to one queue.",
     b:"A typical split: foreground (interactive) and background (batch). Parameters: number of queues, the algorithm for each, how a process's queue is chosen, and scheduling between the queues. Between queues: fixed priority (serve all interactive first, so starvation can happen) or time slices (for example 80% to interactive with RR, 20% to background with FCFS).",
     q:["A system gives 80% of CPU time to the interactive queue and 20% to the batch queue. Which between-queue method is this?","Time-slice scheduling","Fixed-priority scheduling","FCFS","Processor affinity","Each queue gets a set share of CPU time."]},
    {id:"mlfq", t:"Multilevel feedback queue", d:"Like a multilevel queue, except processes can move between queues, which makes aging possible.",
     b:"Parameters: when to upgrade a process, when to demote it, which queue a process enters, the number of queues, and each queue's algorithm. Lecture example: Q0 = RR with an 8 ms quantum, Q1 = RR with 16 ms, Q2 = FCFS. Aging, raising a waiting process's priority over time, prevents starvation.",
     q:["A job uses its whole 8 ms quantum in Q0 without finishing. In the usual setup, where does it go next?","Down to Q1, RR with a 16 ms quantum","Up above Q0","It is terminated","Into Q2, forever","Jobs that use their full quantum are demoted to the next queue."]},
    {id:"amp", t:"Asymmetric vs symmetric multiprocessing", d:"One master processor makes every scheduling decision, versus every processor scheduling itself.",
     b:"Asymmetric: only one processor accesses the system data structures, so there's little need to share data. That master server handles scheduling decisions, I/O processing and other system activities, while the other processors run only user processes. Symmetric (SMP): each processor is self-scheduling.",
     q:["In SMP, who decides what each processor runs next?","Each processor schedules itself","A single master processor","The long-term scheduler","The disk controller","SMP processors are self-scheduling."]},
    {id:"affinity", t:"Processor affinity", d:"Keeping a thread on the same processor so it can reuse the data already sitting in that processor's cache.",
     b:"While a thread runs on a processor, that processor's cache fills with the thread's memory accesses. Soft affinity: the OS tries to keep the thread on the same processor, with no guarantee. Hard affinity: the process specifies the set of processors it may run on.",
     q:["A process tells the OS it may only run on cores 2 and 3. Which kind of affinity is this?","Hard affinity","Soft affinity","Load balancing","Push migration","The process itself restricts the set of processors."]},
    {id:"balance", t:"Load balancing", d:"Keeping work evenly spread across processors in SMP, by pushing tasks off busy CPUs or pulling them onto idle ones.",
     b:"With SMP, all CPUs need to stay loaded for efficiency. Push migration: a periodic task checks each processor's load and pushes tasks from overloaded CPUs to others. Pull migration: an idle processor pulls a waiting task from a busy one.",
     q:["An idle core grabs a waiting task from an overloaded core. What is this called?","Pull migration","Push migration","Hard affinity","Dispatch latency","The idle processor pulls the work toward itself."]},
    {id:"stall", t:"Memory stall", d:"Time a processor spends waiting for data to arrive from memory, which a multithreaded core fills by switching threads.",
     b:"Multicore processors complicate scheduling: multicore CPUs, multithreaded cores, NUMA systems, and heterogeneous multiprocessing. During a memory stall the CPU would sit idle waiting for data, so a multithreaded core makes use of the situation by switching to another thread.",
     q:["Why does a multithreaded core switch threads during a memory stall?","To do useful work instead of idling while data arrives","To free the page table","To shorten the time quantum","To enforce hard affinity","The stall is time the core would otherwise waste."]},
    {id:"realtime", t:"Real-time scheduling", d:"Scheduling where deadlines matter: some systems must always meet them, others only give critical tasks top priority.",
     b:"Soft real-time: critical real-time tasks get the highest priority, but there's no guarantee when they'll run. Hard real-time: a task must be serviced by its deadline. Event latency, the time from an event occurring to it being serviced, has two parts: interrupt latency (interrupt arrival to the start of its service routine) and dispatch latency (taking the current process off the CPU and switching to another).",
     q:["A car's airbag controller must react before its deadline every single time. What kind of system is it?","Hard real-time","Soft real-time","Batch","Time-sharing","Missing the deadline is not allowed, ever."]}
  ],
  bossQ:[
    ["priority","Non-preemptive priority, all at time 0: P1 (priority 3, burst 10), P2 (1, burst 1), P5 (2, burst 5). Which runs second?","P5","P1","P2","They run together","Order by priority number: P2, then P5, then P1."],
    ["mlfq","The Starver keeps low-priority jobs waiting forever. Which feedback-queue technique fixes that?","Aging: gradually raising the priority of waiting jobs","A bigger time quantum","Hard affinity","Pull migration","Aging lets a starving process climb until it runs."],
    ["mlq","Fixed priority between queues: serve all interactive work, then background. What risk does the lecture name?","Starvation of the background queue","Deadlock","A convoy in the interactive queue","External fragmentation","If interactive work never runs out, background work never runs."],
    ["affinity","A thread is moved to a different core and runs slowly at first. Why?","Its data isn't in the new core's cache yet","The new core has no PCB for it","Moving it requires a reboot","Its quantum was reset","Affinity exists to keep a warm cache."],
    ["realtime","Event latency is made of which two parts?","Interrupt latency and dispatch latency","Seek time and rotational time","Waiting time and turnaround time","Fetch time and decode time","Both delays sit between the event and its service."],
    ["amp","In asymmetric multiprocessing, what do the non-master processors run?","Only user processes","All scheduling decisions","All I/O processing","The system data structures","The master server handles the system work."]
  ]
},
{
  id:8, sec:7, district:"Memory Maze", lec:"Lecture 7, Section 7", topic:"Memory recall, protection, address binding, the MMU, dynamic loading and linking", color:"#7dff9e",
  pal:{a:"#0b2819", b:"#0e301f", w:"#16603a", t:"#229158"},
  boss:{ name:"The Stray Pointer", role:"an address that belongs to nobody", color:"#ff9f43", look:{crown:true, ghost:true},
    intro:"Every address I make is a little bit wrong. Just below your base. Just past your limit. Catch me if you can.",
    hurt:["You checked me against the limit. Cheater.","Relocated? I was sure that address was absolute.","A stub found the routine. I was hiding it!"],
    miss:["Out of range. Trap to the operating system!","Wrong binding time. Recompile everything.","Illegal addressing error. Mine, all mine."] },
  intro:["The Memory Maze, {op}. Every process down here lives between two walls: a base and a limit.",
         "Something called the Stray Pointer keeps generating addresses that belong to nobody. Every time it touches someone else's memory, the hardware traps. Collect the cards, sync them, then we pin it down."],
  mid:"Look at the address tags on these walls. Symbolic names up top, relocatable offsets in the middle, absolute addresses at the bottom. NULL walked all three levels without once seeing a real physical address.",
  gate:"Every card synced. The Stray Pointer is cornered behind the gate. Check its addresses against base and limit and it has nowhere to go.",
  outro:["Every address is back inside its own base and limit. The traps have gone quiet.",
         "NULL moved on to the partitions next door, where free memory is handed out in holes. Something over there is shredding them."],
  relic:{title:"Relocation note", text:"Relocation register: 14000. Logical address: 346. Physical address: 14346. NULL never saw a real physical address. Neither does any user program."},
  cards:[
    {id:"recall", t:"Registers, memory and cache", d:"The CPU reads its registers in about one clock cycle, but a main memory read takes several cycles and stalls it; a faster cache sits in between.",
     b:"The CPU can directly access only its registers and main memory. A register read usually happens in a single clock cycle. A memory read can take more than one cycle, so the CPU stalls while it waits. A cache sits between main memory and the CPU and is faster than main memory. Memory must also be protected: a process must not access the memory locations of other processes.",
     q:["An instruction reads a value from main memory instead of a register. What usually happens?","The CPU stalls for several cycles waiting for memory","It finishes in exactly one clock cycle","The OS swaps the process out","The page table is erased","A memory read takes more than one cycle, so the CPU waits: a stall."]},
    {id:"memmgmt", t:"Memory management", d:"Deciding what is in memory and when: tracking who uses which parts, choosing what moves in and out, and allocating and freeing space.",
     b:"To execute a program, all or part of its instructions and data must be in memory. Memory management aims for good CPU utilization and fast response to users. Its activities: keeping track of which parts of memory are in use and by whom; deciding which processes, or parts of them, and data move into and out of memory; allocating and deallocating memory space as needed. The OS protects memory by giving each program base and limit addresses.",
     q:["Which of these is NOT a memory management activity?","Choosing the round robin time quantum","Tracking which parts of memory are in use and by whom","Deciding which processes move into and out of memory","Allocating and freeing memory space","The time quantum belongs to CPU scheduling, not memory management."]},
    {id:"baselimit", t:"Base and limit registers", d:"A pair of registers that define the legal address range of a process, checked by the CPU on every user-mode access.",
