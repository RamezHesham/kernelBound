/* ---------- movement and interaction ---------- */
const tileAt=(x,y)=>(L.m.g[y]&&L.m.g[y][x])||'#';
function tryMove(dx,dy){
  if(!L||L.locked||L.paused||anyModal()) return;
  if(L.inBoss&&!L.dodge) return;
  const nx=L.px+dx, ny=L.py+dy, t=tileAt(nx,ny);
  if(t==='#'||t==='B') return;
  if(L.dodge&&t!=='b') return;
  if(t==='G'&&!gateOpen()&&!L.bossDown){ viewGateLocked(); toast('Gate locked: sync every card first.'); return; }
  L.fx=L.rx; L.fy=L.ry; L.px=nx; L.py=ny; L.stepAt=performance.now();
  onEnter(nx,ny);
}
function onEnter(x,y){
  if(L.inBoss) return;
  const o=L.m.obj[y][x];
  const onT=o&&o.t==='T', onN=o&&o.t==='N';
  if(L.here&&!onT&&!onN) viewMission();
  if(tileAt(x,y)==='b'){ if(!L.bossDown) startBoss(); return; }
  if(!o) return;
  if(o.t==='S'&&!has(o.card)) pickShard(o.card);
  else if(onT) viewTerminal();
  else if(onN) viewNpc();
  else if(o.t==='X'&&!S.relics[L.ch.id]) collectRelic();
}
function interact(){
  if(!L) return;
  const nb=qs('#con [data-next]');
  if(L.locked||L.inBoss){ if(nb&&!nb.disabled) nb.click(); return; }
  const o=L.m.obj[L.py][L.px];
  if(o&&o.t==='T'){ startSync(); return; }
  if(o&&o.t==='N'){ viewNpc(); return; }
  const g=L.m.gate; if(Math.abs(g.x-L.px)+Math.abs(g.y-L.py)===1&&!gateOpen()&&!L.bossDown){ viewGateLocked(); return; }
  toast('Nothing to use here.',1200);
}
function hit(now){
  L.hearts--; L.inv=now+1500; hud();
  if(L.hearts<=0){
    L.hearts=3; L.px=L.m.start.x; L.py=L.m.start.y; L.fx=L.px; L.fy=L.py; L.rx=L.px; L.ry=L.py; L.inv=now+2000;
    L.hu.forEach(h=>{ h.x=h.sx; h.y=h.sy; h.tx=h.sx; h.ty=h.sy; h.stun=now+1500; h.chase=false; });
    addXP(-15); toast('Kernel recovery: back to the start. Your cards are safe. -15 XP',3200); announce('Integrity lost. Back to the start.');
    if(L.here) viewMission();
  } else { toast(pick(['Bug bite! Integrity -1','Segfault! Integrity -1','Something got you. Integrity -1'])); announce('Hit by a bug. Integrity '+L.hearts+' of 3.'); }
  hud();
}
function togglePause(){ if(!L) return; L.paused=!L.paused; $('pauseBtn').textContent=L.paused?'Resume':'Pause'; announce(L.paused?'Paused':'Resumed'); }

/* ---------- boss ---------- */
function bossQ(i){ const b=L.ch.bossQ[i]; return {card:cardOf(L.ch,b[0]),kind:'boss',prompt:b[1],correct:b[2],opts:shuffle([b[2],b[3],b[4],b[5]]),explain:b[6]}; }

const bossTime=()=>Math.max(12,Math.round(26-L.ch.id*1.2));
const nextTurn=()=>S.calm?viewBoss:()=>startDodge(viewBoss);

function bossAnswer(ok,fb,q,late){

/* ---------- boss counterattack (dodge phase) ---------- */
const DODGE_LINES=['My turn.','Dodge this, Operator.','Stand still. It will only hurt a lot.','Let us see how fast you really are.'];
function startDodge(next){
  const ch=L.ch;
  const waves=3+Math.floor(ch.id/4);
  L.dodge={waves,i:0,phase:'warn',t:0,tiles:new Set(),next,hitWave:false};
  L.locked=false; held.clear();
  con('<div class="boss-top"><p class="kick" style="margin:0">Counterattack</p><b>HP '+L.boss.hp+'/'+L.boss.max+'</b></div><h2 class="ptitle">Dodge!</h2>'+
    say(ch.boss.name,ch.boss.role,pick(DODGE_LINES),'boss',ch.boss.color)+
    '<p class="note">Red tiles are about to be hit. Move onto a tile that isn\'t marked before it fires. You can only move inside the boss room.</p>'+
    '<div class="obj"><div class="r"><span>Waves left</span><b id="dodgeLeft">'+waves+'</b></div></div>');
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  if(narrow()) $('stage').scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'});
  newWave();
}
function newWave(){
  const D=L.dodge, ch=L.ch, room=L.m.room, me={x:L.px,y:L.py};
  const pool=['row','col','checker']; if(ch.id>=5) pool.push('safe');
  const p=pick(pool); let set;
  const rows=[], cols=[]; room.forEach(t=>{ if(rows.indexOf(t.y)<0) rows.push(t.y); if(cols.indexOf(t.x)<0) cols.push(t.x); });
  const aim=Math.random()<0.7;
  if(p==='row'){ const n=ch.id>=3?2:1; let rs=shuffle(rows.slice()).slice(0,n); if(aim&&rs.indexOf(me.y)<0) rs[0]=me.y; set=room.filter(t=>rs.indexOf(t.y)>=0); }
  else if(p==='col'){ const n=ch.id>=7?2:1; let c=shuffle(cols.slice()).slice(0,n); if(aim&&c.indexOf(me.x)<0) c[0]=me.x; set=room.filter(t=>c.indexOf(t.x)>=0); }
  else if(p==='checker'){ const k=(me.x+me.y)%2; set=room.filter(t=>(t.x+t.y)%2===k); }
  else { const far=room.filter(t=>Math.abs(t.x-me.x)+Math.abs(t.y-me.y)>=2); const s=pick(far.length?far:room); set=room.filter(t=>t!==s); }
  D.tiles=new Set(set.map(t=>t.x+','+t.y)); D.phase='warn'; D.hitWave=false;
  D.t=Math.max(0.55,0.85-ch.id*0.025)+(p==='safe'?0.45:p==='checker'?0.1:0);
}
function dodgeHit(now){
  const D=L.dodge; D.hitWave=true; L.hearts--; L.boss.hits++; L.inv=now+500; L.shake=0; hud();
  toast(pick(['Hit! Integrity -1','Too slow! Integrity -1','Direct hit on you. Integrity -1']),1400); announce('Hit by the counterattack. Integrity '+L.hearts+' of 3.');
  if(L.hearts<=0){ L.dodge=null; L.locked=true; bossFail(); }
}
function dodgeUpdate(dt,now){
  const D=L.dodge; if(!D) return;
  D.t-=dt; const here=L.px+','+L.py;
  if(D.phase==='warn'){ if(D.t<=0){ D.phase='fire'; D.t=0.28; if(D.tiles.has(here)) dodgeHit(now); } }
  else if(D.phase==='fire'){ if(!D.hitWave&&D.tiles.has(here)) dodgeHit(now); if(L.dodge&&D.t<=0){ D.phase='gap'; D.t=0.3; } }
  else if(D.t<=0){
    D.i++; const el=$('dodgeLeft'); if(el) el.textContent=String(D.waves-D.i);
    if(D.i>=D.waves){ const nx=D.next; L.dodge=null; L.locked=true; nx(); } else newWave();
  }
}

/* ---------- hunters: viruses that chase you ---------- */
function hPass(x,y){ return tileAt(x,y)==='.'&&!L.m.safe.has(x+','+y); }
function bfsNext(sx,sy,tx,ty,maxLen){
  const prev={}; const k0=sx+','+sy; prev[k0]=null; let q=[[sx,sy,0]];
  while(q.length){
    const nq=[];
    for(const [x,y,d] of q){
      if(x===tx&&y===ty){ let c=x+','+y, p=prev[c]; if(p===null) return null; while(prev[p]!==null){ c=p; p=prev[p]; } const s=c.split(','); return {x:+s[0],y:+s[1]}; }
      if(d>=maxLen) continue;
      D4.forEach(dd=>{ const nx=x+dd[0], ny=y+dd[1], k=nx+','+ny; if(!(k in prev)&&(hPass(nx,ny)||(nx===tx&&ny===ty))){ prev[k]=x+','+y; nq.push([nx,ny,d+1]); } });
    }
    q=nq;
  }
  return null;
}
function hunterStep(h,dt,now){
  if(now<h.stun) return;
  const dx=h.tx-h.x, dy=h.ty-h.y, d=Math.hypot(dx,dy), mv=h.spd*dt;
  if(d>1e-3){ if(mv>=d){ h.x=h.tx; h.y=h.ty; } else { h.x+=dx/d*mv; h.y+=dy/d*mv; } return; }
  const cx=h.tx, cy=h.ty; let next=null; h.chase=false;
  const safeMe=L.m.safe.has(L.px+','+L.py)||tileAt(L.px,L.py)!=='.';
  if(!safeMe&&Math.abs(cx-L.px)+Math.abs(cy-L.py)<=7){ next=bfsNext(cx,cy,L.px,L.py,10); if(next) h.chase=true; }
  if(!next){
    const opts=D4.map(dd=>({x:cx+dd[0],y:cy+dd[1]})).filter(t=>hPass(t.x,t.y));
    const fwd=opts.filter(t=>!h.last||t.x!==h.last.x||t.y!==h.last.y);
    const pool=fwd.length?fwd:opts; next=pool.length?pick(pool):null;
  }
  if(next){ h.last={x:cx,y:cy}; h.tx=next.x; h.ty=next.y; }
}

/* ---------- drawing ---------- */
function rect(x,y,w,h,c,g){ (g||ctx).fillStyle=c; (g||ctx).fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function buildBG(){
  const c=document.createElement('canvas'); c.width=cv.width; c.height=cv.height; const g=c.getContext('2d');
  const P=L.ch.pal, m=L.m;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const t=m.g[y][x], px=x*TILE, py=y*TILE, seed=(x*31+y*17+L.ch.id*7)%97;
    if(t==='#'){
      rect(px,py,TILE,TILE,P.w,g);
      const below=m.g[y+1]&&m.g[y+1][x]!=='#';
      rect(px,py,TILE,5,P.t,g);
      if(below) rect(px,py+TILE-7,TILE,7,'rgba(0,0,0,.35)',g);
      rect(px,py+17,TILE,2,'rgba(0,0,0,.2)',g);
      rect(px+(seed%2?9:23),py+5,2,12,'rgba(0,0,0,.2)',g); rect(px+(seed%2?25:11),py+19,2,below?10:17,'rgba(0,0,0,.2)',g);
      if(seed%9===0){ rect(px+6,py+24,4,4,L.ch.color,g); }
      if(seed%13===0){ rect(px+26,py+9,3,3,'#ffc83d',g); }
    } else if(t==='b'||t==='B'){
      rect(px,py,TILE,TILE,'#1d0710',g); rect(px,py,TILE,1,'rgba(255,77,94,.25)',g); rect(px,py,1,TILE,'rgba(255,77,94,.25)',g);
      if((x+y)%2===0) rect(px+14,py+14,8,8,'rgba(255,77,94,.12)',g);
    } else {
      rect(px,py,TILE,TILE,(x+y)%2?P.a:P.b,g);
      rect(px,py,TILE,1,'rgba(255,255,255,.04)',g); rect(px,py,1,TILE,'rgba(255,255,255,.04)',g);
      if(seed%5===0) rect(px+16,py+16,3,3,'rgba(255,255,255,.07)',g);
    }
  }
  // hazard trim around the boss room
  for(let y=2;y<=8;y++) for(let x=0;x<COLS;x++){
    if(m.g[y][x]==='#'&&D4.some(d=>{ const t=m.g[y+d[1]]&&m.g[y+d[1]][x+d[0]]; return t==='b'||t==='B'; })){
      const px=x*TILE, py=y*TILE; for(let i=0;i<TILE;i+=12) rect(px+i,py,6,5,'#ffc83d',g);
    }
  }
  L.bg=c;
}
function drawPlayer(px,py,t){
  const b=reduced?0:Math.round(Math.sin(t/170)*1.5);
  if(t<L.inv&&Math.floor(t/90)%2===0) ctx.globalAlpha=.35;
  rect(px+10,py+31,16,3,'rgba(0,0,0,.35)');
  rect(px+11,py+5+b,14,12,'#e8f4ff'); rect(px+13,py+8+b,10,5,'#19d3ff'); rect(px+15,py+9+b,3,2,'#ffffff');
  rect(px+10,py+17+b,16,10,'#2f63b3'); rect(px+12,py+19+b,12,3,'#ffc83d');
  rect(px+7,py+18+b,3,8,'#e8f4ff'); rect(px+26,py+18+b,3,8,'#e8f4ff');
  rect(px+11,py+27+b,5,4,'#0b1e3f'); rect(px+20,py+27+b,5,4,'#0b1e3f');
  ctx.globalAlpha=1;
}
function drawByte(px,py,t){
  const b=reduced?0:Math.round(Math.sin(t/260)*2);
  rect(px+11,py+31,14,3,'rgba(0,0,0,.35)');
  rect(px+17,py+3+b,2,6,'#19d3ff'); rect(px+16,py+1+b,4,3,'#ff3d8b');
  rect(px+8,py+9+b,20,15,'#19d3ff'); rect(px+10,py+11+b,16,9,'#0b1e3f');
  rect(px+12,py+13+b,3,4,'#ffffff'); rect(px+21,py+13+b,3,4,'#ffc83d');
  rect(px+5,py+14+b,3,5,'#7fe8ff'); rect(px+28,py+14+b,3,5,'#7fe8ff');
  rect(px+12,py+25+b,12,2,'rgba(25,211,255,.55)');
}
function drawTerm(px,py,t,busy,hot){
  const scr=hot?'#ff4d5e':busy?L.ch.color:'#2bd97c';
  rect(px+4,py+6,28,20,'#0b1e3f'); rect(px+7,py+9,22,14,scr); rect(px+9,py+11,11,2,'#0b1e3f'); rect(px+9,py+15,7,2,'#0b1e3f');
  if(!hot&&(reduced||Math.floor(t/420)%2)) rect(px+18,py+15,4,2,'#0b1e3f');
  rect(px+14,py+26,8,4,'#0b1e3f'); rect(px+8,py+30,20,3,'#0b1e3f');
  if(busy&&!reduced){ ctx.globalAlpha=.18+.12*Math.sin(t/300); rect(px+1,py+3,34,26,scr); ctx.globalAlpha=1; }
}
function drawShard(px,py,t,n){
  const col=L.ch.color, b=reduced?0:Math.round(Math.sin(t/230+n)*2), cx=px+18, cy=py+16+b;
  rect(cx-9,py+31,18,3,'rgba(0,0,0,.3)');
  ctx.globalAlpha=.2; rect(cx-15,cy-15,30,30,col); ctx.globalAlpha=1;
  for(let i=-4;i<=4;i++){ const w=(5-Math.abs(i))*5; rect(cx-w/2,cy+i*3-1,w,3,col); }
  rect(cx-7,cy-6,3,3,'#ffffff');
  ctx.fillStyle='#0b1e3f'; ctx.font='8px "Press Start 2P", monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(n),cx+1,cy+1);
}
function drawRelic(px,py,t){
  const b=reduced?0:Math.round(Math.sin(t/200)*2), cx=px+18, cy=py+16+b;
  rect(cx-2,cy-11,4,22,'#ffc83d'); rect(cx-11,cy-2,22,4,'#ffc83d'); rect(cx-6,cy-6,12,12,'#ffc83d'); rect(cx-2,cy-2,4,4,'#ffffff');
  if(!reduced&&Math.floor(t/300)%2){ rect(cx+9,cy-12,3,3,'#ffffff'); rect(cx-13,cy+8,3,3,'#ffffff'); }
}
function drawGate(px,py,open,t){
  if(open){ ['#2bd97c'].forEach(c=>{ rect(px+2,py+2,TILE-4,4,c); rect(px+2,py+TILE-6,TILE-4,4,c); rect(px+2,py+2,4,TILE-4,c); rect(px+TILE-6,py+2,4,TILE-4,c); });
    if(!reduced){ ctx.globalAlpha=.25+.15*Math.sin(t/250); rect(px+6,py+6,TILE-12,TILE-12,'#2bd97c'); ctx.globalAlpha=1; } }
  else { rect(px,py,TILE,TILE,'#2a0710'); for(let i=0;i<4;i++) rect(px+3+i*9,py+1,4,TILE-2,'#ff4d5e');
    rect(px+11,py+15,14,11,'#ffc83d'); rect(px+13,py+10,10,6,'#ffc83d'); rect(px+15,py+12,6,4,'#2a0710'); rect(px+17,py+18,2,5,'#2a0710'); }
}
function drawBug(e,t){
  const px=e.x*TILE, py=e.y*TILE, leg=reduced?0:Math.floor(t/120)%2, c=e.col;
  rect(px+10,py+30,16,3,'rgba(0,0,0,.35)');
  rect(px+12,py+3,2,4,c); rect(px+22,py+3,2,4,c);
  rect(px+12,py+7,12,4,c); rect(px+10,py+10,16,15,c);
  rect(px+13,py+13,4,4,'#ffffff'); rect(px+20,py+13,4,4,'#ffffff'); rect(px+14,py+14,2,2,'#0b1e3f'); rect(px+21,py+14,2,2,'#0b1e3f');
  rect(px+14,py+20,8,2,'#0b1e3f');
  rect(px+6,py+(leg?12:15),4,2,c); rect(px+26,py+(leg?15:12),4,2,c); rect(px+6,py+(leg?20:23),4,2,c); rect(px+26,py+(leg?23:20),4,2,c);
}
function drawHunter(h,t){
  const px=h.x*TILE, py=h.y*TILE, c='#a855f7', c2='#e9d5ff', p=reduced?0:Math.round(Math.abs(Math.sin(t/140)));
  if(t<h.stun) ctx.globalAlpha=.45;
  rect(px+10,py+30,16,3,'rgba(0,0,0,.35)');
  rect(px+17,py+2,2,5,c2); rect(px+17,py+29,2,4,c2); rect(px+3,py+17,5,2,c2); rect(px+28,py+17,5,2,c2);
  rect(px+7,py+6,3,3,c2); rect(px+26,py+6,3,3,c2); rect(px+7,py+26,3,3,c2); rect(px+26,py+26,3,3,c2);
  rect(px+9-p,py+8-p,18+2*p,20+2*p,c);
  rect(px+12,py+13,5,4,'#ffffff'); rect(px+20,py+13,5,4,'#ffffff'); rect(px+14,py+14,2,3,'#ff1f3d'); rect(px+22,py+14,2,3,'#ff1f3d');
  rect(px+12,py+11,5,2,'#2a0040'); rect(px+20,py+11,5,2,'#2a0040'); rect(px+13,py+22,10,2,'#2a0040');
  ctx.globalAlpha=1;
  if(h.chase&&t>=h.stun){ rect(px+16,py-8,4,7,'#ffc83d'); rect(px+16,py+1,4,3,'#ffc83d'); }
}
function shade(hex,f){ const n=parseInt(hex.slice(1),16); const r=Math.round(((n>>16)&255)*f), g=Math.round(((n>>8)&255)*f), b=Math.round((n&255)*f); return 'rgb('+r+','+g+','+b+')'; }
function bossBody(cx,cy,s,col,lk,t){
  const x=cx-s/2, y=cy-s/2, dark='#1a0610';
  if(lk.ghost) ctx.globalAlpha=.85;
  if(!lk.ghost) rect(x+4,y+s+3,s-8,4,'rgba(0,0,0,.4)');
  if(lk.horns){ rect(x+3,y-8,6,12,col); rect(x+s-9,y-8,6,12,col); rect(x+1,y-12,4,5,col); rect(x+s-5,y-12,4,5,col); }
  rect(x+4,y,s-8,6,col); rect(x,y+5,s,s-10,col);
  if(lk.ghost){ const off=reduced?0:Math.floor(t/160)%2*4; for(let i=0;i<s;i+=8) rect(x+i+(off&&i%16===0?0:0),y+s-6,5,8+((i/8+off/4)%2)*3,col); }
  else { rect(x+5,y+s-6,10,8,col); rect(x+s-15,y+s-6,10,8,col); }
  rect(x+s*.18,y+s*.3,s*.24,s*.2,dark); rect(x+s*.58,y+s*.3,s*.24,s*.2,dark);
  rect(x+s*.23,y+s*.34,s*.1,s*.1,'#ff4d5e'); rect(x+s*.63,y+s*.34,s*.1,s*.1,'#ff4d5e');
  rect(x+s*.22,y+s*.66,s*.56,5,dark); for(let i=0;i<4;i++) rect(x+s*.26+i*s*.13,y+s*.66+4,4,4,dark);
  if(lk.crown){ rect(x+s*.2,y-7,s*.6,7,'#ffc83d'); rect(x+s*.2,y-12,5,5,'#ffc83d'); rect(x+s*.47,y-13,5,6,'#ffc83d'); rect(x+s*.8-5,y-12,5,5,'#ffc83d'); rect(x+s*.49,y-5,3,3,'#ff3d8b'); }
  rect(x+6,y+6,s*.25,4,'rgba(255,255,255,.35)');
  ctx.globalAlpha=1;
}
function drawBoss(t){
  const B=L.m.boss, bs=L.ch.boss, lk=bs.look||{};
  let cx=(B.x+.5)*TILE, cy=(B.y+.5)*TILE;
  if(L.bossDown){
    rect(cx-24,cy+6,48,14,'#5b6478'); rect(cx-16,cy-2,32,10,'#707a90'); rect(cx-10,cy+1,6,3,'#2a2f3a'); rect(cx+4,cy+1,6,3,'#2a2f3a');
    ctx.fillStyle='#2bd97c'; ctx.font='7px "Press Start 2P", monospace'; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillText('RESTORED',cx,cy-22); return;
  }
  if(t<L.shake&&!reduced) cx+=(Math.floor(t/45)%2?4:-4);
  const col=t<L.flash?'#ffffff':bs.color, bob=reduced?0:Math.round(Math.sin(t/320)*3);
  if(L.inBoss&&!reduced){ ctx.globalAlpha=.16+.08*Math.sin(t/200); rect(cx-TILE*1.5,cy-TILE*2.5,TILE*3,TILE*5,col); ctx.globalAlpha=1; }
  if(lk.twin){ bossBody(cx-24,cy+bob,38,col,lk,t); bossBody(cx+24,cy-bob,38,t<L.flash?col:shade(bs.color,.75),lk,t); }
  else if(lk.heads>1){
    bossBody(cx,cy+8+bob,48,col,lk,t);
    const nh=lk.heads-1;
    for(let i=0;i<nh;i++){ const sx=(nh===1?0:(i===0?-1:1))*28, hx=nh===1?cx+26:cx+sx, hy=cy-26-bob; rect((hx+cx)/2-3,hy+8,6,22,col); bossBody(hx,hy,24,col,{horns:lk.horns},t); }
  } else if(lk.glitch){
    const g=reduced?0:1;
    bossBody(cx,cy+bob,54,t<L.flash?'#ffffff':'#e6e6e6',{},t);
    for(let i=0;i<5;i++){ const yy=cy-27+i*11+bob, off=g?Math.round(Math.sin(t/70+i*2)*5):0; rect(cx-27+off,yy,54,3,i%2?'#ff3d8b':'#19d3ff'); }
    rect(cx-27,cy-27+bob,54,54,'rgba(0,0,0,.18)');
  } else bossBody(cx,cy+bob,54,col,lk,t);
}
function draw(t){
  const m=L.m;
  ctx.drawImage(L.bg,0,0);
  drawGate(m.gate.x*TILE,m.gate.y*TILE,gateOpen()||L.bossDown||L.inBoss,t);
  const busy=L.ch.cards.some(c=>has(c)&&box(c)<2);
  m.terms.forEach(p=>drawTerm(p.x*TILE,p.y*TILE,t,busy,m.terms.length>1&&L.lastTerm===p.x+','+p.y));
  m.shards.forEach(s=>{ if(!has(s.card)) drawShard(s.x*TILE,s.y*TILE,t,s.card.idx+1); });
  if(!S.relics[L.ch.id]&&Math.abs(m.relic.x-L.px)+Math.abs(m.relic.y-L.py)<=3) drawRelic(m.relic.x*TILE,m.relic.y*TILE,t);
  drawByte(m.npc.x*TILE,m.npc.y*TILE,t);
  drawBoss(t);
  L.en.forEach(e=>drawBug(e,t));
  L.hu.forEach(h=>drawHunter(h,t));
  if(L.dodge){
    const D=L.dodge;
    D.tiles.forEach(k=>{ const s=k.split(','), px=+s[0]*TILE, py=+s[1]*TILE;
      if(D.phase==='warn'){ ctx.globalAlpha=reduced?0.5:0.35+0.25*Math.abs(Math.sin(t/90)); rect(px+2,py+2,TILE-4,TILE-4,'#ff2e4d'); ctx.globalAlpha=1; for(let i=0;i<TILE;i+=9) rect(px+i,py+TILE-5,5,3,'#ffc83d'); }
      else if(D.phase==='fire'){ ctx.globalAlpha=0.85; rect(px,py,TILE,TILE,L.ch.boss.color); ctx.globalAlpha=1; rect(px+TILE/2-3,py,6,TILE,'#ffffff'); }
    });
  }
  drawPlayer(L.rx*TILE,L.ry*TILE,t);
  if(t<L.toastUntil&&L.toast){
    ctx.font='9px "Press Start 2P", monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const w=Math.min(cv.width-24,ctx.measureText(L.toast).width+34);
    rect(cv.width/2-w/2,8,w,28,'#0b1e3f'); rect(cv.width/2-w/2,8,w,3,L.ch.color); ctx.fillStyle='#eaf2ff'; ctx.fillText(L.toast,cv.width/2,24);
  }
  if(L.paused){ rect(0,0,cv.width,cv.height,'rgba(3,9,22,.7)'); ctx.fillStyle='#ffc83d'; ctx.font='18px "Press Start 2P", monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('PAUSED',cv.width/2,cv.height/2); ctx.font='9px "Press Start 2P", monospace'; ctx.fillStyle='#eaf2ff'; ctx.fillText('Press P or the Resume button',cv.width/2,cv.height/2+28); }
}

/* ---------- loop ---------- */
const held=new Set(); let padDir=null;
const KEYDIR={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
const PADDIR={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function heldDir(){ if(padDir) return PADDIR[padDir]; let d=null; held.forEach(k=>{ d=KEYDIR[k]; }); return d; }
let last=performance.now();
function update(dt,now){
  const frozen=L.paused||anyModal();
  const canMove=!frozen&&!L.locked&&(!L.inBoss||!!L.dodge);
  if(canMove){ const d=heldDir(); if(d&&now>=L.moveAt){ tryMove(d[0],d[1]); L.moveAt=now+125; } L.time+=dt; }
  const k=Math.min(1,(now-L.stepAt)/110); L.rx=L.fx+(L.px-L.fx)*k; L.ry=L.fy+(L.py-L.fy)*k;
  if(!frozen&&L.dodge) dodgeUpdate(dt,now);
  if(frozen||L.locked||L.inBoss) return;
  L.hu.forEach(h=>{ hunterStep(h,dt,now); if(now>=L.inv&&now>=h.stun&&Math.hypot(h.x-L.rx,h.y-L.ry)<0.62){ h.stun=now+1600; hit(now); } });
  L.en.forEach(e=>{
    e.p+=e.dir*e.spd*dt;
    if(e.p>=e.b){ e.p=e.b; e.dir=-1; } if(e.p<=e.a){ e.p=e.a; e.dir=1; }
    if(e.ax==='h'){ e.x=e.p; e.y=e.c; } else { e.x=e.c; e.y=e.p; }
    if(now>=L.inv&&Math.hypot(e.x-L.rx,e.y-L.ry)<0.62) hit(now);
  });
}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(L&&!$('play').hidden){ L.en.forEach(e=>{ if(e.x===undefined){ e.x=e.ax==='h'?e.p:e.c; e.y=e.ax==='h'?e.c:e.p; } }); update(dt,now); draw(now); if(now-(L.hudT||0)>250){ L.hudT=now; const ht=$('hudTime'); if(ht) ht.textContent=fmtT(L.time); } }
}

/* ---------- input ---------- */
document.addEventListener('keydown',e=>{
  const k=e.key, tg=e.target, tag=tg&&tg.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(k==='Escape'){ if(stack.length){ e.preventDefault(); closeTop(); } return; }
  const scope=stack.length?$(stack[stack.length-1]):$('con');
  if(/^[1-4]$/.test(k)){ const b=scope.querySelector('[data-opt="'+(+k-1)+'"]:not([disabled])'); if(b){ e.preventDefault(); b.click(); return; } }
  if((k==='f'||k==='F')&&stack[stack.length-1]==='mCard'){ const b=qs('#mCard [data-act="flip"]')||qs('#mCard [data-act="flipback"]'); if(b){ e.preventDefault(); b.click(); } return; }
  if(stack.length) return;
  if(!L||$('play').hidden) return;
  if(KEYDIR[k]){ e.preventDefault(); if(!held.has(k)){ held.add(k); L.moveAt=performance.now()+180; tryMove(KEYDIR[k][0],KEYDIR[k][1]); } return; }
  if(k==='e'||k==='E'){ e.preventDefault(); interact(); return; }
  if((k===' '||k==='Enter')&&tag!=='BUTTON'){ e.preventDefault(); interact(); return; }
  if(k==='p'||k==='P'){ e.preventDefault(); togglePause(); }
});
document.addEventListener('keyup',e=>{ held.delete(e.key); if(e.key.length===1) held.delete(e.key.toLowerCase()===e.key?e.key.toUpperCase():e.key.toLowerCase()); });
window.addEventListener('blur',()=>{ held.clear(); padDir=null; });
const pad=$('pad');
pad.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-dir]'); if(!b) return; e.preventDefault();
  const d=b.dataset.dir; if(d==='use'){ interact(); return; }
  padDir=d; if(L){ L.moveAt=performance.now()+200; tryMove(PADDIR[d][0],PADDIR[d][1]); }
  try{ b.setPointerCapture(e.pointerId); }catch(err){}
});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pad.addEventListener(ev,()=>{ padDir=null; }));
pad.addEventListener('contextmenu',e=>e.preventDefault());
pad.addEventListener('click',e=>{ const b=e.target.closest('[data-dir]'); if(b&&e.detail===0){ const d=b.dataset.dir; if(d==='use') interact(); else tryMove(PADDIR[d][0],PADDIR[d][1]); } });
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.open){ const w=b.dataset.open;
    if(w==='deck') openDeck(); else if(w==='log') openLog(); else if(w==='review') openReview(); else if(w==='board') openBoard(b.dataset.boardCh?+b.dataset.boardCh:0); else if(w==='hub'){ closeAllModals(); renderHub(); window.scrollTo(0,0); }
    return; }
  if(b.dataset.go){ launch(+b.dataset.go); return; }
  if(b.hasAttribute('data-close')) closeTop();
});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('mousedown',e=>{ if(e.target===m&&m.id!=='mCard'&&m.id!=='mStory') closeModal(m.id); }));
$('pauseBtn').addEventListener('click',togglePause);
$('logoBtn').addEventListener('click',()=>{ closeAllModals(); renderHub(); window.scrollTo(0,0); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&L&&!L.paused&&!L.locked) togglePause(); });

/* ---------- boot ---------- */
renderHub();
initBoard();
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load){ document.fonts.load('8px "Press Start 2P"').catch(()=>{}); }
window.__kb={S:()=>S,L:()=>L,CHAPTERS,genMap,startChapter,grade,BYID};
})();
</script>
